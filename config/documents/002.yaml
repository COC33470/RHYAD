reference: "002"
title: "Programme Fonctionnel"
subtitle: "CEVA – Campus de Production d’Autovaccins – Royaume d’Arabie Saoudite"
revision: "Rev.0.1"
status: "Working Draft"

chapters:
  - title: "PARTIE 1 — GÉNÉRALITÉS"
    text: "Programme Fonctionnel du Campus de production d’autovaccins vétérinaires."

  - title: "1. Objet"
    text: >
      Le présent Programme Fonctionnel définit les besoins fonctionnels du Campus de production
      d’autovaccins vétérinaires.

      Il constitue le document de référence permettant de traduire les besoins de CEVA en
      exigences de conception destinées aux équipes de maîtrise d’œuvre et aux bureaux d’études.

  - title: "2. Objectifs du Programme Fonctionnel"
    bullets:
      - "définir les besoins fonctionnels du futur Campus ;"
      - "formaliser les exigences de CEVA ;"
      - "identifier les interfaces entre les fonctions ;"
      - "définir les critères de performance attendus ;"
      - "préparer les Design Basis ;"
      - "garantir l’évolutivité du projet."

  - title: "3. Périmètre"
    text: >
      Le Programme Fonctionnel couvre l’ensemble des fonctions nécessaires à la conception, à
      la réalisation et à l’exploitation du Campus.

      Les fonctions sont organisées en quinze chapitres fonctionnels (F01 à F15).

  - title: "4. Documents de référence"
    tables:
      - title: "Documents de référence"
        headers:
          - "Référence"
          - "Document"
        rows:
          - ["RHYAD-001", "Charte Projet"]
          - ["RHYAD-001A", "Analyse de Contexte et d’Adaptation du Projet (ACAP)"]
          - ["RHYAD-003", "Glossaire"]
          - ["RHYAD-004", "Registre des Risques"]
          - ["RHYAD-005", "Registre des Décisions"]
          - ["RHYAD-006", "Plan Directeur Documentaire"]

  - title: "5. Glossaire"
    text: >
      Les définitions et acronymes utilisés dans le présent document sont regroupés dans le
      RHYAD-003 – Glossaire.

  - title: "6. Hypothèses générales"
    text: >
      Les hypothèses de conception sont suivies dans le DT-000 – Registre des Hypothèses de
      Conception.

      Le présent document ne reprend que les hypothèses ayant une incidence directe sur les
      besoins fonctionnels.

  - title: "7. Principes de conception"
    bullets:
      - "permettre une montée en capacité de 100–300 L vers 1000 L ;"
      - "être conçu de manière évolutive ;"
      - "assurer la séparation des flux ;"
      - "répondre aux exigences GMP/BPF ;"
      - "faciliter la maintenance et l’exploitation ;"
      - "intégrer les contraintes du contexte local identifiées dans l’ACAP."

  - title: "8. Évolutivité du Campus"
    bullets:
      - "augmentation des capacités de production ;"
      - "ajout de nouvelles lignes de production ;"
      - "intégration de nouvelles technologies ;"
      - "évolutions réglementaires ;"
      - "limitation des impacts sur l’exploitation existante."

  - title: "PARTIE 2 — FONCTIONS"
    text: >
      Les fonctions F01 à F15 sont listées ci-dessous. Les contenus détaillés sont portés par
      les documents indépendants de chaque fonction.
    tables:
      - title: "Fonctions du Programme Fonctionnel"
        headers:
          - "Code"
          - "Fonction"
        rows:
          - ["F01", "Réception et Expédition"]
          - ["F02", "Stockage des Matières Premières et Consommables"]
          - ["F03", "Préparation des Matières Premières et Solutions"]
          - ["F04", "Production des Autovaccins"]
          - ["F05", "Conditionnement et Expédition des Produits"]
          - ["F06", "Gestion des Flux"]
          - ["F07", "Lavage, Stérilisation et Préparation des Équipements"]
          - ["F08", "Contrôle Qualité"]
          - ["F09", "Utilités Industrielles"]
          - ["F10", "Maintenance et Exploitation Technique"]
          - ["F11", "Gestion des Déchets et Effluents"]
          - ["F12", "Sûreté, Protection des Actifs et Contrôle des Accès"]
          - ["F13", "SI, Automatismes et Cybersécurité"]
          - ["F14", "Administration, Formation et Services Généraux"]
          - ["F15", "Gouvernance du Campus et Fonctions Transverses"]

  - title: "9. Structure des documents fonctionnels"
    text: >
      Les chapitres F01 à F15 constituent le cœur du Programme Fonctionnel.

      Chaque fonction est développée dans un document indépendant selon la structure RHYAD
      validée :
    bullets:
      - "1. Objectif"
      - "2. Synthèse"
      - "3. Mission"
      - "4. Exigences fonctionnelles"
      - "5. Interfaces"
      - "6. Contraintes de conception"
      - "7. Critères de performance"
      - "8. Documents de référence"
      - "9. Atelier CEVA"
      - "10. Impacts documentaires"
      - "11. Contexte local"
      - "12. Recommandations RHYAD"

  - title: "10. Intégration des fonctions"
    text: >
      Ne pas intégrer le contenu détaillé des fonctions dans RHYAD-002.

      Prévoir uniquement un emplacement (placeholder) pour chaque fonction afin de permettre
      leur intégration automatique lors de la génération d'une version consolidée du Programme
      Fonctionnel.
