- title: 4. Exigences fonctionnelles
- title: F09-01 -- Disponibilité
  blocks:
  - type: text
    text: Les utilités doivent assurer la continuité des activités.
  text: Les utilités doivent assurer la continuité des activités.
- title: F09-02 -- Redondance
  blocks:
  - type: text
    text: Les infrastructures critiques devront disposer d'un niveau de redondance justifié.
  text: Les infrastructures critiques devront disposer d'un niveau de redondance justifié.
- title: F09-03 -- Performance énergétique
  blocks:
  - type: text
    text: Les installations devront limiter les consommations d'énergie.
  text: Les installations devront limiter les consommations d'énergie.
- title: F09-04 -- Résilience
  blocks:
  - type: text
    text: Maintien des fonctions critiques lors de défaillances limitées.
  text: Maintien des fonctions critiques lors de défaillances limitées.
- title: F09-05 -- Maintenabilité
  blocks:
  - type: text
    text: Maintenance sans interruption majeure.
  text: Maintenance sans interruption majeure.
