    text: 'Comparer :'
  - type: list
    items:
    - groupes frigorifiques classiques ;
    - refroidissement par bassin d'eau ;
    - géocooling / géothermie ;
    - solutions hybrides.
  - type: text
    text: Le choix devra être justifié par une analyse multicritère.
