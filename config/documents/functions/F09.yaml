reference: CEVA-RHYAD-100-F09
title: Utilités Industrielles
revision: Rev1.0
status: Validated
chapters:
- title: 1. Objet
  blocks:
  - type: text
    text: La fonction F09 -- Utilités Industrielles définit les exigences fonctionnelles relatives à l'ensemble des utilités
      nécessaires au fonctionnement du Campus CEVA RHYAD.
  - type: text
    text: Elle couvre les réseaux de production, de distribution, de stockage et de supervision des utilités nécessaires aux
      bâtiments, aux laboratoires et aux procédés industriels.
  - type: text
    text: Le présent document décrit les besoins fonctionnels sans préjuger des solutions techniques qui seront retenues lors
      des phases de conception.
  text: 'La fonction F09 -- Utilités Industrielles définit les exigences fonctionnelles relatives à l''ensemble des utilités
    nécessaires au fonctionnement du Campus CEVA RHYAD.


    Elle couvre les réseaux de production, de distribution, de stockage et de supervision des utilités nécessaires aux bâtiments,
    aux laboratoires et aux procédés industriels.


    Le présent document décrit les besoins fonctionnels sans préjuger des solutions techniques qui seront retenues lors des
    phases de conception.'
- title: 2. Objectifs
  blocks:
  - type: list
    items:
    - alimentation continue des procédés ;
    - alimentation des bâtiments ;
    - disponibilité des utilités critiques ;
    - sécurité d'exploitation ;
    - maintenabilité ;
    - optimisation énergétique ;
    - évolutivité du Campus.
  bullets:
