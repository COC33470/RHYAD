- title: F08-07 -- Continuité d'activité
  blocks:
  - type: text
    text: Les installations critiques doivent présenter un niveau élevé de disponibilité.
  - type: text
    text: 'Sont notamment critiques :'
  - type: list
    items:
    - traitement d'air ;
    - alimentations électriques sécurisées ;
    - chambres froides ;
    - systèmes de supervision.
