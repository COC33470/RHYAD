- title: F08-05 -- Protection des échantillons
  blocks:
  - type: text
    text: Les installations doivent assurer leur conservation.
  text: Les installations doivent assurer leur conservation.
- title: F08-06 -- Sécurité
  blocks:
  - type: text
    text: 'Les laboratoires doivent assurer :'
  - type: list
    items:
    - sécurité des opérateurs ;
    - protection des échantillons ;
    - maîtrise des risques chimiques ;
    - maîtrise des risques biologiques ;
    - confinement lorsque requis.
