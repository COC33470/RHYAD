- title: 4. Exigences fonctionnelles
- title: F08-01 -- Séparation des activités
  blocks:
  - type: text
    text: Les différentes activités analytiques doivent être organisées afin d'éviter les contaminations croisées.
  text: Les différentes activités analytiques doivent être organisées afin d'éviter les contaminations croisées.
- title: F08-02 -- Conditions environnementales
  blocks:
  - type: text
    text: Les laboratoires doivent disposer de conditions adaptées.
  - type: text
    text: 'Les laboratoires classés doivent garantir :'
  - type: list
    items:
    - classe de propreté ;
    - cascades de pression ;
    - température ;
    - humidité ;
    - continuité de fonctionnement.
  text: 'Les laboratoires doivent disposer de conditions adaptées.


    Les laboratoires classés doivent garantir :'
  bullets:
  - classe de propreté ;
  - cascades de pression ;
  - température ;
  - humidité ;
  - continuité de fonctionnement.
- title: F08-03 -- Gestion des échantillons
  blocks:
  - type: text
    text: 'Les installations doivent permettre :'
  - type: list
    items:
    - réception ;
    - identification ;
    - stockage ;
    - préparation ;
    - analyse ;
    - archivage ;
    - élimination.
  text: 'Les installations doivent permettre :'
  bullets:
