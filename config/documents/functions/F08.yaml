reference: CEVA-RHYAD-100-F08
title: Contrôle Qualité
revision: Rev1.0
status: Validated
chapters:
- title: 1. Objet
  blocks:
  - type: text
    text: La fonction F08 -- Contrôle Qualité définit les exigences fonctionnelles relatives aux activités de contrôle qualité
      (QC), d'analyse, de qualification des lots et de libération des produits du Campus CEVA RHYAD.
  - type: text
    text: Elle couvre les espaces, équipements et interfaces nécessaires au contrôle des matières premières, des produits
      en cours de fabrication et des produits finis afin de garantir leur conformité avant leur mise à disposition.
  - type: text
    text: Le présent document décrit exclusivement les besoins fonctionnels du projet et ne définit ni les méthodes analytiques,
      ni les procédures qualité, ni les exigences d'accréditation des laboratoires.
  text: 'La fonction F08 -- Contrôle Qualité définit les exigences fonctionnelles relatives aux activités de contrôle qualité
    (QC), d''analyse, de qualification des lots et de libération des produits du Campus CEVA RHYAD.


    Elle couvre les espaces, équipements et interfaces nécessaires au contrôle des matières premières, des produits en cours
    de fabrication et des produits finis afin de garantir leur conformité avant leur mise à disposition.


    Le présent document décrit exclusivement les besoins fonctionnels du projet et ne définit ni les méthodes analytiques,
    ni les procédures qualité, ni les exigences d''accréditation des laboratoires.'
- title: 2. Objectifs
  blocks:
  - type: list
    items:
    - contrôle qualité des matières premières ;
    - contrôle qualité des produits intermédiaires ;
    - contrôle qualité des produits finis ;
    - gestion des échantillons ;
    - traçabilité des analyses ;
    - qualification et libération des lots ;
    - archivage réglementaire des échantillons et résultats.
  bullets:
  - contrôle qualité des matières premières ;
  - contrôle qualité des produits intermédiaires ;
  - contrôle qualité des produits finis ;
  - gestion des échantillons ;
  - traçabilité des analyses ;
  - qualification et libération des lots ;
  - archivage réglementaire des échantillons et résultats.
- title: 3. Périmètre
  blocks:
  - type: text
    text: 'La fonction couvre notamment :'
  - type: list
    items:
    - laboratoires de contrôle qualité ;
    - laboratoires microbiologiques ;
    - laboratoires physico-chimiques ;
    - laboratoires de biologie moléculaire si nécessaires ;
    - zones de préparation des échantillons ;
    - locaux de stockage des échantillons ;
    - chambres froides dédiées ;
    - bureaux associés.
  - type: text
    text: 'Sont exclus :'
  - type: list
    items:
    - méthodes analytiques ;
    - procédures qualité ;
    - systèmes LIMS ;
    - procédures opératoires.
  text: 'La fonction couvre notamment :


