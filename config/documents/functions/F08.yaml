  - identification ;
  - stockage ;
  - préparation ;
  - analyse ;
  - archivage ;
  - élimination.
- title: F08-04 -- Traçabilité
  blocks:
  - type: text
    text: 'Chaque analyse doit être traçable :'
  - type: list
    items:
    - échantillon ;
    - lot ;
    - opérateur ;
    - équipement ;
    - méthode ;
    - date et heure.
  text: 'Chaque analyse doit être traçable :'
