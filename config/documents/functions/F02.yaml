reference: CEVA-RHYAD-100-F02
title: Stockage des Matières Premières et Consommables
revision: Rev1.0
status: Validated
chapters:
- title: 1. Objet
  text: 'La fonction F02 -- Stockage des Matières Premières et Consommables

    définit les exigences fonctionnelles relatives au stockage des matières

    premières, consommables, réactifs, emballages et produits nécessaires au

    fonctionnement du Campus CEVA RHYAD.


    Cette fonction décrit les besoins du projet sans préjuger des solutions

    techniques qui seront retenues lors des phases de conception.'
- title: 2. Objectifs
  text: 'La fonction doit permettre :'
  bullets:
  - le stockage sécurisé des matières premières et consommables ;
  - le maintien des conditions de conservation requises ;
  - la séparation des différentes catégories de produits ;
  - la disponibilité permanente des produits nécessaires à la production ;
  - la traçabilité complète des mouvements de stock ;
  - la maîtrise des risques de contamination et de dégradation.
- title: 3. Périmètre
  text: 'La fonction couvre notamment :


    Sont exclus :'
  bullets:
  - les magasins de matières premières ;
  - les magasins de consommables ;
  - les magasins de produits chimiques ;
  - les chambres froides et locaux réfrigérés ;
  - les zones de quarantaine ;
  - les zones de libération qualité ;
  - les zones de stockage temporaire ;
  - les circulations internes associées.
  - la gestion informatique des stocks (ERP/WMS) ;
  - les procédures qualité ;
  - les procédures d'exploitation.
- title: 4. Exigences fonctionnelles
- title: F02-01 -- Conditions de conservation
  text: 'Les espaces de stockage doivent maintenir les conditions

    environnementales adaptées aux produits stockés.'
- title: F02-02 -- Séparation des produits
  text: 'Les différentes catégories de produits doivent pouvoir être séparées

    selon leur nature, leur statut qualité ou leur niveau de risque.'
- title: F02-03 -- Quarantaine
  text: 'Des zones dédiées doivent permettre l''isolement des produits en attente

    de contrôle ou de libération.'
- title: F02-04 -- Traçabilité
  text: 'Chaque mouvement doit être enregistré afin d''assurer une traçabilité

    complète :'
  bullets:
  - identification ;
  - date ;
  - localisation ;
  - quantité ;
  - statut.
- title: F02-05 -- Rotation des stocks
  text: 'L''organisation du stockage doit permettre l''application des règles de

    gestion des stocks définies par le Maître d''Ouvrage.'
- title: F02-06 -- Accessibilité
  text: 'Les produits doivent rester facilement accessibles pour :'
  bullets:
  - les opérations de réception ;
  - les prélèvements ;
  - l'approvisionnement de la production ;
  - les inventaires.
- title: F02-07 -- Sécurité
  text: 'Les installations doivent assurer :'
  bullets:
  - la protection des personnes ;
  - la protection des produits ;
  - la prévention des incompatibilités chimiques ;
  - le contrôle des accès.
- title: F02-08 -- Continuité d'activité
  text: 'Les dispositions retenues doivent garantir la disponibilité des matières

    premières et consommables nécessaires aux activités critiques du Campus.'
- title: 5. Interfaces
  bullets:
  - F01 --- Réception et Expédition
  - F03 --- Préparation des Matières Premières et Solutions
  - F04 --- Production des Autovaccins
  - F06 --- Gestion des Flux
  - F08 --- Contrôle Qualité
  - F09 --- Utilités Industrielles
  - F10 --- Maintenance et Exploitation Technique
  - F12 --- Sûreté, Protection des Actifs et Contrôle des Accès
  - F13 --- SI, Automatismes et Cybersécurité
- title: 6. Contraintes
  bullets:
  - exigences GMP/BPF ;
  - conditions de conservation des produits ;
  - exigences de sécurité incendie ;
  - contraintes climatiques locales ;
  - exigences de traçabilité ;
  - contraintes liées aux produits dangereux et aux incompatibilités chimiques.
- title: 7. Critères de performance
  bullets:
  - conservation conforme des produits ;
  - disponibilité permanente des matières premières et consommables ;
  - traçabilité complète des stocks ;
  - gestion sécurisée des produits ;
  - exploitation simple et efficace ;
  - capacité d'évolution compatible avec les extensions futures du Campus.
- title: 8. Documents associés
  bullets:
  - CEVA-RHYAD-001A-ACAP
  - CEVA-RHYAD-200-DT-F02-01 et suivants
  - CEVA-RHYAD-300-DB09 --- Logistique
  - CEVA-RHYAD-300-DB04 --- Utilités
  - CEVA-RHYAD-500-REG04 --- Registre des Hypothèses
  - CEVA-RHYAD-500-REG05 --- Registre des Interfaces
- title: 9. Critères de validation
  text: 'La fonction F02 sera considérée comme validée lorsque :'
  bullets:
  - les besoins fonctionnels seront approuvés par le Maître d'Ouvrage ;
  - les interfaces auront été identifiées ;
  - les données techniques nécessaires auront été collectées ;
  - les hypothèses de conception auront été enregistrées dans les DT associés.
- title: Fin du document
