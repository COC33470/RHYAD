reference: CEVA-RHYAD-100-F02
title: Stockage des Matières Premières et Consommables
revision: Rev1.0
status: Validated
chapters:
- title: 1. Objet
  blocks:
  - type: text
    text: La fonction F02 -- Stockage des Matières Premières et Consommables définit les exigences fonctionnelles relatives
      au stockage des matières premières, consommables, réactifs, emballages et produits nécessaires au fonctionnement du
      Campus CEVA RHYAD.
  - type: text
    text: Cette fonction décrit les besoins du projet sans préjuger des solutions techniques qui seront retenues lors des
      phases de conception.
  text: 'La fonction F02 -- Stockage des Matières Premières et Consommables définit les exigences fonctionnelles relatives
    au stockage des matières premières, consommables, réactifs, emballages et produits nécessaires au fonctionnement du Campus
    CEVA RHYAD.


    Cette fonction décrit les besoins du projet sans préjuger des solutions techniques qui seront retenues lors des phases
    de conception.'
- title: 2. Objectifs
  blocks:
  - type: text
    text: 'La fonction doit permettre :'
  - type: list
    items:
    - le stockage sécurisé des matières premières et consommables ;
    - le maintien des conditions de conservation requises ;
    - la séparation des différentes catégories de produits ;
    - la disponibilité permanente des produits nécessaires à la production ;
    - la traçabilité complète des mouvements de stock ;
    - la maîtrise des risques de contamination et de dégradation.
  text: 'La fonction doit permettre :'
  bullets:
  - le stockage sécurisé des matières premières et consommables ;
  - le maintien des conditions de conservation requises ;
  - la séparation des différentes catégories de produits ;
  - la disponibilité permanente des produits nécessaires à la production ;
  - la traçabilité complète des mouvements de stock ;
  - la maîtrise des risques de contamination et de dégradation.
- title: 3. Périmètre
  blocks:
  - type: text
    text: 'La fonction couvre notamment :'
  - type: list
    items:
    - les magasins de matières premières ;
    - les magasins de consommables ;
    - les magasins de produits chimiques ;
    - les chambres froides et locaux réfrigérés ;
    - les zones de quarantaine ;
    - les zones de libération qualité ;
    - les zones de stockage temporaire ;
    - les circulations internes associées.
  - type: text
    text: 'Sont exclus :'
  - type: list
    items:
    - la gestion informatique des stocks (ERP/WMS) ;
    - les procédures qualité ;
    - les procédures d'exploitation.
  text: 'La fonction couvre notamment :


    Sont exclus :'
  bullets:
  - les magasins de matières premières ;
  - les magasins de consommables ;
  - les magasins de produits chimiques ;
  - les chambres froides et locaux réfrigérés ;
  - les zones de quarantaine ;
  - les zones de libération qualité ;
  - les zones de stockage temporaire ;
  - les circulations internes associées.
  - la gestion informatique des stocks (ERP/WMS) ;
  - les procédures qualité ;
  - les procédures d'exploitation.
- title: 4. Exigences fonctionnelles
- title: F02-01 -- Conditions de conservation
  blocks:
  - type: text
    text: Les espaces de stockage doivent maintenir les conditions environnementales adaptées aux produits stockés.
  text: Les espaces de stockage doivent maintenir les conditions environnementales adaptées aux produits stockés.
- title: F02-02 -- Séparation des produits
  blocks:
  - type: text
    text: Les différentes catégories de produits doivent pouvoir être séparées selon leur nature, leur statut qualité ou leur
      niveau de risque.
  text: Les différentes catégories de produits doivent pouvoir être séparées selon leur nature, leur statut qualité ou leur
    niveau de risque.
- title: F02-03 -- Quarantaine
  blocks:
  - type: text
    text: Des zones dédiées doivent permettre l'isolement des produits en attente de contrôle ou de libération.
  text: Des zones dédiées doivent permettre l'isolement des produits en attente de contrôle ou de libération.
- title: F02-04 -- Traçabilité
  blocks:
  - type: text
    text: 'Chaque mouvement doit être enregistré afin d''assurer une traçabilité complète :'
  - type: list
    items:
    - identification ;
    - date ;
    - localisation ;
    - quantité ;
    - statut.
  text: 'Chaque mouvement doit être enregistré afin d''assurer une traçabilité complète :'
  bullets:
  - identification ;
  - date ;
  - localisation ;
  - quantité ;
  - statut.
- title: F02-05 -- Rotation des stocks
  blocks:
  - type: text
    text: L'organisation du stockage doit permettre l'application des règles de gestion des stocks définies par le Maître
      d'Ouvrage.
  text: L'organisation du stockage doit permettre l'application des règles de gestion des stocks définies par le Maître d'Ouvrage.
- title: F02-06 -- Accessibilité
  blocks:
  - type: text
    text: 'Les produits doivent rester facilement accessibles pour :'
  - type: list
    items:
    - les opérations de réception ;
    - les prélèvements ;
    - l'approvisionnement de la production ;
    - les inventaires.
  text: 'Les produits doivent rester facilement accessibles pour :'
  bullets:
  - les opérations de réception ;
  - les prélèvements ;
  - l'approvisionnement de la production ;
  - les inventaires.
- title: F02-07 -- Sécurité
  blocks:
  - type: text
    text: 'Les installations doivent assurer :'
  - type: list
    items:
    - la protection des personnes ;
    - la protection des produits ;
    - la prévention des incompatibilités chimiques ;
    - le contrôle des accès.
  text: 'Les installations doivent assurer :'
  bullets:
  - la protection des personnes ;
  - la protection des produits ;
  - la prévention des incompatibilités chimiques ;
  - le contrôle des accès.
- title: F02-08 -- Continuité d'activité
  blocks:
  - type: text
    text: Les dispositions retenues doivent garantir la disponibilité des matières premières et consommables nécessaires aux
      activités critiques du Campus.
  text: Les dispositions retenues doivent garantir la disponibilité des matières premières et consommables nécessaires aux
    activités critiques du Campus.
