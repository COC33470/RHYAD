reference: CEVA-RHYAD-100-F12
title: Sûreté, Protection des Actifs et Contrôle des Accès
revision: Rev1.0
status: Validated
chapters:
- title: 1. Objet
  blocks:
  - type: text
    text: La fonction F12 -- Sûreté, Protection des Actifs et Contrôle des Accès définit les exigences fonctionnelles relatives
      à la protection des personnes, des installations, des équipements, des produits, des informations et des infrastructures
      critiques du Campus CEVA RHYAD.
  - type: text
    text: Elle couvre les dispositifs de sûreté physique nécessaires au maintien de l'intégrité du site tout au long de son
      exploitation.
  - type: text
    text: Le présent document ne traite pas de la cybersécurité, qui fait l'objet de la fonction F13.
  text: 'La fonction F12 -- Sûreté, Protection des Actifs et Contrôle des Accès définit les exigences fonctionnelles relatives
    à la protection des personnes, des installations, des équipements, des produits, des informations et des infrastructures
    critiques du Campus CEVA RHYAD.


    Elle couvre les dispositifs de sûreté physique nécessaires au maintien de l''intégrité du site tout au long de son exploitation.


    Le présent document ne traite pas de la cybersécurité, qui fait l''objet de la fonction F13.'
