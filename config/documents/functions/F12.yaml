- title: 4. Exigences fonctionnelles
- title: F12-01 -- Zonage de sûreté
  blocks:
  - type: text
    text: Le Campus devra être organisé en niveaux de sûreté adaptés.
  text: Le Campus devra être organisé en niveaux de sûreté adaptés.
- title: F12-02 -- Contrôle des accès
  blocks:
  - type: text
    text: Accès limité aux seules personnes autorisées avec niveaux d'autorisation adaptables.
  text: Accès limité aux seules personnes autorisées avec niveaux d'autorisation adaptables.
- title: F12-03 -- Protection des infrastructures critiques
  blocks:
  - type: text
    text: Protection renforcée des locaux électriques, salles serveurs, salles de supervision, CTA des salles blanches, centrales
      utilités et installations de stockage des données.
  text: Protection renforcée des locaux électriques, salles serveurs, salles de supervision, CTA des salles blanches, centrales
    utilités et installations de stockage des données.
- title: F12-04 -- Surveillance
  blocks:
  - type: text
    text: Surveillance continue des zones sensibles avec historisation des événements.
  text: Surveillance continue des zones sensibles avec historisation des événements.
- title: F12-05 -- Gestion des visiteurs
  blocks:
  - type: text
    text: Les visiteurs devront être identifiés, enregistrés et accompagnés.
  text: Les visiteurs devront être identifiés, enregistrés et accompagnés.
- title: F12-06 -- Continuité d'activité
  blocks:
  - type: text
    text: Les systèmes critiques devront disposer d'une alimentation secourue adaptée.
  text: Les systèmes critiques devront disposer d'une alimentation secourue adaptée.
- title: F12-07 -- Intégration avec les autres systèmes
  blocks:
  - type: text
    text: Interface avec GTB/GTC, contrôle d'accès, vidéosurveillance, SSI et systèmes informatiques autorisés.
  text: Interface avec GTB/GTC, contrôle d'accès, vidéosurveillance, SSI et systèmes informatiques autorisés.
