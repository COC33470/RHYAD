reference: CEVA-RHYAD-100-F04
title: Production des Autovaccins
revision: Rev1.0
status: Validated
chapters:
- title: 1. Objet
  blocks:
  - type: text
    text: La fonction F04 -- Production des Autovaccins définit les exigences fonctionnelles relatives aux activités de production
      des autovaccins vétérinaires au sein du Campus CEVA RHYAD.
  - type: text
    text: Elle couvre l'ensemble des espaces et fonctions nécessaires à la fabrication, depuis l'introduction des matières
      préparées jusqu'au transfert des produits vers les étapes de contrôle qualité, de conditionnement ou de stockage intermédiaire.
  - type: text
    text: Le présent document décrit exclusivement les besoins fonctionnels du projet et ne définit ni les procédés de fabrication,
      ni les recettes de production.
  text: 'La fonction F04 -- Production des Autovaccins définit les exigences fonctionnelles relatives aux activités de production
    des autovaccins vétérinaires au sein du Campus CEVA RHYAD.


    Elle couvre l''ensemble des espaces et fonctions nécessaires à la fabrication, depuis l''introduction des matières préparées
    jusqu''au transfert des produits vers les étapes de contrôle qualité, de conditionnement ou de stockage intermédiaire.


    Le présent document décrit exclusivement les besoins fonctionnels du projet et ne définit ni les procédés de fabrication,
    ni les recettes de production.'
- title: 2. Objectifs
  blocks:
  - type: list
    items:
    - production d'autovaccins conforme GMP/BPF ;
    - maîtrise des contaminations croisées ;
    - flexibilité des installations ;
    - protection du personnel, des produits et de l'environnement ;
    - disponibilité élevée des infrastructures critiques ;
    - évolutivité du Campus.
  bullets:
  - production d'autovaccins conforme GMP/BPF ;
  - maîtrise des contaminations croisées ;
  - flexibilité des installations ;
  - protection du personnel, des produits et de l'environnement ;
  - disponibilité élevée des infrastructures critiques ;
  - évolutivité du Campus.
- title: 3. Périmètre
  blocks:
  - type: text
    text: 'La fonction couvre notamment :'
  - type: list
    items:
    - salles de production ;
    - salles de culture ;
    - salles de préparation finale ;
    - locaux techniques associés ;
    - SAS personnel et matériel ;
    - zones de transfert ;
    - circulations de production.
  - type: text
    text: 'Sont exclus :'
  - type: list
    items:
    - procédures de fabrication ;
    - paramètres de production ;
    - recettes MES ;
    - procédures qualité ;
    - procédures d'exploitation.
  text: 'La fonction couvre notamment :


    Sont exclus :'
  bullets:
  - salles de production ;
  - salles de culture ;
  - salles de préparation finale ;
  - locaux techniques associés ;
  - SAS personnel et matériel ;
  - zones de transfert ;
  - circulations de production.
  - procédures de fabrication ;
  - paramètres de production ;
  - recettes MES ;
  - procédures qualité ;
  - procédures d'exploitation.
- title: 4. Exigences fonctionnelles
- title: F04-01 -- Conformité GMP/BPF
  blocks:
  - type: text
    text: Les installations doivent permettre une production conforme aux exigences réglementaires applicables.
  text: Les installations doivent permettre une production conforme aux exigences réglementaires applicables.
- title: F04-02 -- Confinement
  blocks:
  - type: text
    text: Les locaux doivent assurer un niveau de confinement adapté.
  text: Les locaux doivent assurer un niveau de confinement adapté.
- title: F04-03 -- Traitement d'air des salles blanches
  blocks:
  - type: text
    text: 'Le traitement d''air doit garantir :'
  - type: list
    items:
    - la classe de propreté requise ;
    - les cascades de pression ;
    - la température et l'humidité ;
    - les renouvellements d'air ;
    - la continuité de fonctionnement.
  - type: text
    text: Le traitement d'air des salles blanches est une infrastructure critique.
  text: 'Le traitement d''air doit garantir :


