    text: Les installations doivent permettre l'évolution des procédés.
  text: Les installations doivent permettre l'évolution des procédés.
- title: F04-06 -- Nettoyage
  blocks:
  - type: text
    text: Les locaux et équipements doivent permettre le nettoyage et la décontamination.
  text: Les locaux et équipements doivent permettre le nettoyage et la décontamination.
- title: F04-07 -- Traçabilité
  blocks:
  - type: text
    text: Chaque opération doit être traçable.
  text: Chaque opération doit être traçable.
- title: F04-08 -- Continuité d'activité
  blocks:
  - type: text
    text: Les fonctions critiques doivent bénéficier d'un haut niveau de disponibilité.
  text: Les fonctions critiques doivent bénéficier d'un haut niveau de disponibilité.
