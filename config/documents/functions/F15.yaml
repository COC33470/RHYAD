reference: CEVA-RHYAD-100-F15
title: Développement Futur et Réserves Foncières
revision: Rev1.0
status: Validated
chapters:
- title: 1. Objet
  blocks:
  - type: text
    text: La fonction F15 -- Développement Futur et Réserves Foncières définit les exigences fonctionnelles permettant d'assurer
      l'évolutivité du Campus CEVA RHYAD tout au long de son cycle de vie.
  - type: text
    text: Elle couvre les dispositions à prévoir dès la conception afin de faciliter les extensions futures des bâtiments,
      des procédés, des utilités et des infrastructures sans remettre en cause le fonctionnement des installations existantes.
  - type: text
    text: Le présent document définit les besoins fonctionnels du projet sans préjuger des futurs programmes d'investissement.
  text: 'La fonction F15 -- Développement Futur et Réserves Foncières définit les exigences fonctionnelles permettant d''assurer
    l''évolutivité du Campus CEVA RHYAD tout au long de son cycle de vie.


    Elle couvre les dispositions à prévoir dès la conception afin de faciliter les extensions futures des bâtiments, des procédés,
    des utilités et des infrastructures sans remettre en cause le fonctionnement des installations existantes.


    Le présent document définit les besoins fonctionnels du projet sans préjuger des futurs programmes d''investissement.'
- title: 2. Objectifs
  blocks:
  - type: list
    items:
    - extension des capacités de production ;
    - extension des laboratoires ;
    - extension des bâtiments administratifs ;
    - extension des utilités industrielles ;
    - évolution des infrastructures numériques ;
    - adaptation aux évolutions réglementaires ;
    - maîtrise des coûts des futurs développements.
  bullets:
  - extension des capacités de production ;
  - extension des laboratoires ;
  - extension des bâtiments administratifs ;
  - extension des utilités industrielles ;
  - évolution des infrastructures numériques ;
  - adaptation aux évolutions réglementaires ;
  - maîtrise des coûts des futurs développements.
