- title: 4. Exigences fonctionnelles
- title: F15-01 -- Évolutivité
  blocks:
  - type: text
    text: Le Campus devra pouvoir évoluer sans remise en cause majeure des infrastructures existantes.
  text: Le Campus devra pouvoir évoluer sans remise en cause majeure des infrastructures existantes.
- title: F15-02 -- Réserves techniques
  blocks:
  - type: text
    text: Les infrastructures principales devront intégrer des réserves permettant les futurs raccordements.
  text: Les infrastructures principales devront intégrer des réserves permettant les futurs raccordements.
- title: F15-03 -- Réserves foncières
  blocks:
  - type: text
    text: Le plan masse devra préserver des emprises compatibles avec les développements futurs identifiés par le Maître d'Ouvrage.
  text: Le plan masse devra préserver des emprises compatibles avec les développements futurs identifiés par le Maître d'Ouvrage.
- title: F15-04 -- Modularité
  blocks:
  - type: text
    text: Les bâtiments devront être conçus afin de faciliter leur extension lorsque cela est techniquement pertinent.
  text: Les bâtiments devront être conçus afin de faciliter leur extension lorsque cela est techniquement pertinent.
- title: F15-05 -- Continuité d'exploitation
  blocks:
  - type: text
    text: Les futurs travaux devront pouvoir être réalisés avec un impact limité sur les activités en exploitation.
  text: Les futurs travaux devront pouvoir être réalisés avec un impact limité sur les activités en exploitation.
- title: F15-06 -- Compatibilité des infrastructures
  blocks:
  - type: text
    text: Les réseaux principaux devront permettre l'intégration de nouvelles installations sans remise en cause importante
      des ouvrages existants.
  text: Les réseaux principaux devront permettre l'intégration de nouvelles installations sans remise en cause importante
    des ouvrages existants.
- title: F15-07 -- Documentation
  blocks:
  - type: text
    text: Les réserves retenues devront être clairement identifiées dans les documents de conception.
  text: Les réserves retenues devront être clairement identifiées dans les documents de conception.
- title: 5. Interfaces
  blocks:
