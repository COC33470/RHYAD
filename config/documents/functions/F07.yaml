reference: CEVA-RHYAD-100-F07
title: Lavage, Stérilisation et Préparation des Équipements
revision: Rev1.0
status: Validated
chapters:
- title: 1. Objet
  blocks:
  - type: text
    text: La fonction F07 -- Lavage, Stérilisation et Préparation des Équipements définit les exigences fonctionnelles relatives
      au nettoyage, à la décontamination, à la stérilisation, au séchage, au stockage et à la préparation des équipements
      réutilisables nécessaires aux activités du Campus CEVA RHYAD.
  - type: text
    text: Elle couvre les équipements de production, de laboratoire et les accessoires nécessitant une préparation avant leur
      remise en service.
  - type: text
    text: Le présent document décrit les besoins fonctionnels du projet sans définir les procédés de nettoyage, les cycles
      de stérilisation ni les procédures opératoires.
  text: 'La fonction F07 -- Lavage, Stérilisation et Préparation des Équipements définit les exigences fonctionnelles relatives
    au nettoyage, à la décontamination, à la stérilisation, au séchage, au stockage et à la préparation des équipements réutilisables
    nécessaires aux activités du Campus CEVA RHYAD.


    Elle couvre les équipements de production, de laboratoire et les accessoires nécessitant une préparation avant leur remise
    en service.


    Le présent document décrit les besoins fonctionnels du projet sans définir les procédés de nettoyage, les cycles de stérilisation
    ni les procédures opératoires.'
- title: 2. Objectifs
  blocks:
  - type: text
    text: 'La fonction doit permettre :'
  - type: list
    items:
    - le nettoyage des équipements réutilisables ;
    - la décontamination lorsque nécessaire ;
    - la stérilisation des matériels concernés ;
    - le séchage et le stockage avant réutilisation ;
    - la préparation des équipements pour les opérations de production ;
    - la maîtrise des contaminations croisées ;
    - la traçabilité complète des opérations.
  text: 'La fonction doit permettre :'
  bullets:
  - le nettoyage des équipements réutilisables ;
  - la décontamination lorsque nécessaire ;
  - la stérilisation des matériels concernés ;
  - le séchage et le stockage avant réutilisation ;
  - la préparation des équipements pour les opérations de production ;
  - la maîtrise des contaminations croisées ;
  - la traçabilité complète des opérations.
- title: 3. Périmètre
  blocks:
  - type: text
    text: 'La fonction couvre notamment :'
  - type: list
    items:
    - les locaux de lavage ;
    - les locaux de stérilisation ;
    - les autoclaves ;
    - les laveurs industriels ;
    - les zones de séchage ;
    - les zones de stockage des équipements propres ;
    - les SAS de transfert ;
    - les circulations associées.
  - type: text
    text: 'Sont exclus :'
  - type: list
    items:
    - les procédures de nettoyage ;
    - les paramètres de stérilisation ;
    - les qualifications d'équipements ;
    - les procédures qualité.
  text: 'La fonction couvre notamment :


    Sont exclus :'
  bullets:
  - les locaux de lavage ;
  - les locaux de stérilisation ;
  - les autoclaves ;
  - les laveurs industriels ;
  - les zones de séchage ;
  - les zones de stockage des équipements propres ;
  - les SAS de transfert ;
  - les circulations associées.
  - les procédures de nettoyage ;
  - les paramètres de stérilisation ;
  - les qualifications d'équipements ;
  - les procédures qualité.
- title: 4. Exigences fonctionnelles
- title: F07-01 -- Séparation des flux
  blocks:
  - type: text
    text: Les équipements sales et les équipements propres doivent suivre des cheminements distincts afin d'éviter toute recontamination.
  text: Les équipements sales et les équipements propres doivent suivre des cheminements distincts afin d'éviter toute recontamination.
- title: F07-02 -- Conditions environnementales
  blocks:
  - type: text
    text: 'Les locaux doivent offrir des conditions adaptées aux différentes étapes :'
  - type: list
    items:
    - réception des matériels sales ;
    - lavage ;
    - séchage ;
    - stérilisation ;
    - refroidissement ;
    - stockage des matériels propres.
  text: 'Les locaux doivent offrir des conditions adaptées aux différentes étapes :'
  bullets:
  - réception des matériels sales ;
  - lavage ;
  - séchage ;
  - stérilisation ;
  - refroidissement ;
  - stockage des matériels propres.
- title: F07-03 -- Préparation des équipements
  blocks:
  - type: text
    text: Les équipements doivent pouvoir être préparés, assemblés et conditionnés avant leur transfert vers les zones de
      production.
  text: Les équipements doivent pouvoir être préparés, assemblés et conditionnés avant leur transfert vers les zones de production.
- title: F07-04 -- Traçabilité
  blocks:
  - type: text
    text: 'Chaque équipement doit pouvoir être tracé :'
  - type: list
    items:
    - identification ;
    - cycle de lavage ;
    - cycle de stérilisation ;
    - date ;
    - opérateur ;
    - destination.
  text: 'Chaque équipement doit pouvoir être tracé :'
  bullets:
  - identification ;
  - cycle de lavage ;
  - cycle de stérilisation ;
  - date ;
  - opérateur ;
  - destination.
- title: F07-05 -- Continuité d'activité
  blocks:
  - type: text
    text: Les installations devront garantir la disponibilité des équipements nécessaires aux activités critiques du Campus.
  - type: text
    text: Les équipements critiques feront l'objet d'une analyse de redondance adaptée.
  text: 'Les installations devront garantir la disponibilité des équipements nécessaires aux activités critiques du Campus.


    Les équipements critiques feront l''objet d''une analyse de redondance adaptée.'
- title: F07-06 -- Sécurité
  blocks:
  - type: text
    text: 'Les installations doivent assurer :'
  - type: list
    items:
    - la sécurité des opérateurs ;
    - la maîtrise des risques thermiques ;
    - la maîtrise des risques chimiques ;
    - la maîtrise des risques biologiques.
  text: 'Les installations doivent assurer :'
  bullets:
  - la sécurité des opérateurs ;
  - la maîtrise des risques thermiques ;
  - la maîtrise des risques chimiques ;
  - la maîtrise des risques biologiques.
- title: F07-07 -- Maintenabilité
  blocks:
  - type: text
    text: 'Les équipements devront être facilement accessibles afin de permettre :'
  - type: list
    items:
    - la maintenance préventive ;
    - la maintenance corrective ;
    - les opérations de qualification ;
    - les contrôles réglementaires.
  text: 'Les équipements devront être facilement accessibles afin de permettre :'
  bullets:
  - la maintenance préventive ;
  - la maintenance corrective ;
  - les opérations de qualification ;
  - les contrôles réglementaires.
