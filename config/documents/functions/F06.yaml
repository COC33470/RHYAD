- title: 6. Contraintes
  blocks:
  - type: list
    items:
    - exigences GMP/BPF ;
    - principes de marche en avant ;
    - contraintes de biosécurité ;
    - exigences de sûreté ;
    - contraintes de manutention ;
    - contraintes climatiques locales ;
    - exigences d'accessibilité et de maintenance.
