- title: 4. Exigences fonctionnelles
- title: F14-01 -- Fonctionnalité
  blocks:
  - type: text
    text: Les espaces devront permettre les activités administratives et de support.
  text: Les espaces devront permettre les activités administratives et de support.
- title: F14-02 -- Flexibilité
  blocks:
  - type: text
    text: Les espaces administratifs devront être facilement reconfigurables.
  text: Les espaces administratifs devront être facilement reconfigurables.
- title: F14-03 -- Formation
  blocks:
  - type: text
    text: Le Campus devra disposer d'espaces adaptés aux formations internes, réglementaires, techniques et aux réunions de
      projet.
  text: Le Campus devra disposer d'espaces adaptés aux formations internes, réglementaires, techniques et aux réunions de
    projet.
- title: F14-04 -- Confort
  blocks:
  - type: text
    text: Conditions adaptées de température, qualité d'air, acoustique, éclairage et ergonomie.
  text: Conditions adaptées de température, qualité d'air, acoustique, éclairage et ergonomie.
- title: F14-05 -- Accessibilité
  blocks:
  - type: text
    text: Les bâtiments devront être accessibles conformément aux réglementations applicables.
  text: Les bâtiments devront être accessibles conformément aux réglementations applicables.
- title: F14-06 -- Services aux collaborateurs
  blocks:
  - type: text
    text: Prévoir restauration, détente, sanitaires et locaux sociaux.
  text: Prévoir restauration, détente, sanitaires et locaux sociaux.
- title: F14-07 -- Maintenabilité
  blocks:
  - type: text
    text: Les bâtiments devront faciliter la maintenance sans perturber les activités.
  text: Les bâtiments devront faciliter la maintenance sans perturber les activités.
