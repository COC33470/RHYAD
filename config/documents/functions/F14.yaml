reference: CEVA-RHYAD-100-F14
title: Administration, Formation et Services Généraux
revision: Rev1.0
status: Validated
chapters:
- title: 1. Objet
  blocks:
  - type: text
    text: La fonction F14 -- Administration, Formation et Services Généraux définit les exigences fonctionnelles relatives
      aux espaces administratifs, aux locaux de formation, aux services aux collaborateurs et aux fonctions de support nécessaires
      au fonctionnement du Campus CEVA RHYAD.
  - type: text
    text: Elle couvre les bâtiments tertiaires ainsi que les espaces communs participant au bon fonctionnement du site industriel.
  - type: text
    text: Le présent document décrit exclusivement les besoins fonctionnels du projet et ne définit pas l'organisation interne
      du Maître d'Ouvrage.
  text: 'La fonction F14 -- Administration, Formation et Services Généraux définit les exigences fonctionnelles relatives
    aux espaces administratifs, aux locaux de formation, aux services aux collaborateurs et aux fonctions de support nécessaires
    au fonctionnement du Campus CEVA RHYAD.


    Elle couvre les bâtiments tertiaires ainsi que les espaces communs participant au bon fonctionnement du site industriel.


    Le présent document décrit exclusivement les besoins fonctionnels du projet et ne définit pas l''organisation interne
    du Maître d''Ouvrage.'
