reference: CEVA-RHYAD-100-F01
title: Réception et Expédition
revision: Rev1.0
status: Validated
chapters:
- title: 1. Objet
  blocks:
  - type: text
    text: La fonction F01 -- Réception et Expédition définit les exigences fonctionnelles relatives à la réception, au contrôle,
      au stockage temporaire et à l'expédition des matières, consommables, équipements et produits finis du Campus CEVA RHYAD.
  - type: text
    text: Cette fonction décrit les besoins du projet sans préjuger des solutions techniques qui seront retenues lors des
      phases de conception.
  text: 'La fonction F01 -- Réception et Expédition définit les exigences fonctionnelles relatives à la réception, au contrôle,
    au stockage temporaire et à l''expédition des matières, consommables, équipements et produits finis du Campus CEVA RHYAD.


    Cette fonction décrit les besoins du projet sans préjuger des solutions techniques qui seront retenues lors des phases
    de conception.'
- title: 2. Objectifs
  blocks:
  - type: text
    text: 'La fonction doit permettre :'
  - type: list
    items:
    - la réception sécurisée des flux entrants ;
    - l'expédition sécurisée des flux sortants ;
    - la séparation des flux propres et des flux potentiellement contaminés ;
    - la traçabilité complète des mouvements ;
    - la maîtrise des conditions de conservation pendant les opérations logistiques ;
    - la continuité des opérations de réception et d'expédition.
  text: 'La fonction doit permettre :'
  bullets:
  - la réception sécurisée des flux entrants ;
  - l'expédition sécurisée des flux sortants ;
  - la séparation des flux propres et des flux potentiellement contaminés ;
  - la traçabilité complète des mouvements ;
  - la maîtrise des conditions de conservation pendant les opérations logistiques ;
  - la continuité des opérations de réception et d'expédition.
- title: 3. Périmètre
  blocks:
  - type: text
    text: 'La fonction couvre notamment :'
  - type: list
    items:
    - quais de réception ;
    - quais d'expédition ;
    - zones de contrôle ;
    - zones d'attente ;
    - stockage tampon ;
    - contrôle documentaire des livraisons ;
    - circulation des véhicules de livraison ;
    - circulation interne des marchandises.
  - type: text
    text: 'Sont exclus :'
  - type: list
    items:
    - les procédés de fabrication ;
    - les procédures d'exploitation ;
    - la gestion des stocks (ERP/WMS) ;
    - les procédures qualité.
  text: 'La fonction couvre notamment :


    Sont exclus :'
  bullets:
  - quais de réception ;
  - quais d'expédition ;
  - zones de contrôle ;
  - zones d'attente ;
  - stockage tampon ;
  - contrôle documentaire des livraisons ;
  - circulation des véhicules de livraison ;
  - circulation interne des marchandises.
  - les procédés de fabrication ;
  - les procédures d'exploitation ;
  - la gestion des stocks (ERP/WMS) ;
  - les procédures qualité.
- title: 4. Exigences fonctionnelles
- title: F01-01 -- Séparation des flux
  blocks:
  - type: text
    text: Les flux entrants et sortants doivent être organisés afin d'éviter les croisements susceptibles d'entraîner des
      risques de contamination, de sécurité ou d'exploitation.
  text: Les flux entrants et sortants doivent être organisés afin d'éviter les croisements susceptibles d'entraîner des risques
    de contamination, de sécurité ou d'exploitation.
- title: F01-02 -- Contrôle des livraisons
  blocks:
  - type: text
    text: 'Chaque livraison doit pouvoir être :'
  - type: list
    items:
    - identifiée ;
    - contrôlée ;
    - enregistrée ;
    - tracée.
  text: 'Chaque livraison doit pouvoir être :'
  bullets:
  - identifiée ;
  - contrôlée ;
  - enregistrée ;
  - tracée.
- title: F01-03 -- Stockage tampon
  blocks:
  - type: text
    text: 'Des zones de stockage tampon doivent permettre :'
  - type: list
    items:
    - l'attente avant contrôle ;
    - l'attente avant mise à disposition ;
    - l'attente avant expédition.
  text: 'Des zones de stockage tampon doivent permettre :'
  bullets:
  - l'attente avant contrôle ;
  - l'attente avant mise à disposition ;
  - l'attente avant expédition.
- title: F01-04 -- Conditions environnementales
  blocks:
  - type: text
    text: Les conditions de température, d'humidité et de propreté doivent être compatibles avec la nature des produits réceptionnés
      ou expédiés.
  text: Les conditions de température, d'humidité et de propreté doivent être compatibles avec la nature des produits réceptionnés
    ou expédiés.
- title: F01-05 -- Traçabilité
  blocks:
  - type: text
    text: 'Chaque mouvement doit être traçable :'
  - type: list
    items:
    - date ;
    - heure ;
    - origine ;
    - destination ;
    - opérateur ;
    - référence documentaire.
  text: 'Chaque mouvement doit être traçable :'
  bullets:
  - date ;
  - heure ;
  - origine ;
  - destination ;
  - opérateur ;
  - référence documentaire.
- title: F01-06 -- Accessibilité
  blocks:
  - type: text
    text: 'Les installations doivent permettre :'
  - type: list
    items:
    - la réception poids lourds ;
    - les véhicules utilitaires ;
    - les opérations de manutention ;
    - l'accès des secours.
  text: 'Les installations doivent permettre :'
  bullets:
  - la réception poids lourds ;
  - les véhicules utilitaires ;
  - les opérations de manutention ;
  - l'accès des secours.
- title: F01-07 -- Sécurité
  blocks:
  - type: text
    text: 'Les opérations doivent garantir :'
  - type: list
    items:
    - la sécurité des personnes ;
    - la sécurité des biens ;
    - la protection des produits ;
    - le contrôle des accès.
  text: 'Les opérations doivent garantir :'
  bullets:
  - la sécurité des personnes ;
  - la sécurité des biens ;
  - la protection des produits ;
  - le contrôle des accès.
- title: F01-08 -- Continuité d'activité
  blocks:
  - type: text
    text: Les dispositions retenues doivent limiter les interruptions des opérations logistiques et permettre la continuité
      des flux essentiels.
  text: Les dispositions retenues doivent limiter les interruptions des opérations logistiques et permettre la continuité
    des flux essentiels.
