- title: 7. Critères de performance
  blocks:
  - type: list
    items:
    - réception fiable des marchandises ;
    - expédition conforme des produits ;
    - traçabilité complète des opérations ;
    - maîtrise des flux logistiques ;
    - exploitation simple et sécurisée ;
    - évolutivité compatible avec les développements futurs du campus.
  bullets:
