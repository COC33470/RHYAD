    text: 'La fonction F01 sera considérée comme validée lorsque :'
  - type: list
    items:
    - les besoins fonctionnels seront approuvés par le Maître d'Ouvrage ;
    - les interfaces auront été identifiées ;
    - les données techniques nécessaires auront été collectées ;
    - les hypothèses de conception auront été enregistrées dans les DT associés.
