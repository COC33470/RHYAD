- title: 4. Exigences fonctionnelles
- title: F13-01 -- Disponibilité
  blocks:
  - type: text
    text: Disponibilité adaptée à la criticité.
  text: Disponibilité adaptée à la criticité.
- title: F13-02 -- Séparation des réseaux
  blocks:
  - type: text
    text: Segmentation logique et physique des réseaux IT et OT.
  text: Segmentation logique et physique des réseaux IT et OT.
- title: F13-03 -- Cybersécurité
  blocks:
  - type: text
    text: Security by Design avec authentification, gestion des droits, journalisation, détection des incidents et protection
      contre les accès non autorisés.
  text: Security by Design avec authentification, gestion des droits, journalisation, détection des incidents et protection
    contre les accès non autorisés.
- title: F13-04 -- Protection des données
  blocks:
  - type: text
    text: Protection contre la perte, l'altération, les accès non autorisés et l'indisponibilité. Sauvegardes sécurisées et
      testées.
  text: Protection contre la perte, l'altération, les accès non autorisés et l'indisponibilité. Sauvegardes sécurisées et
    testées.
- title: F13-05 -- Continuité des communications
  blocks:
  - type: text
    text: Étudier une liaison satellite comme secours pour les fonctions critiques. Justification dans les Design Basis.
  text: Étudier une liaison satellite comme secours pour les fonctions critiques. Justification dans les Design Basis.
- title: F13-06 -- Supervision
  blocks:
