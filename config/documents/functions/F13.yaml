reference: CEVA-RHYAD-100-F13
title: Systèmes d’Information, Automatismes et Cybersécurité
revision: Rev1.0
status: Validated
chapters:
- title: 1. Objet
  blocks:
  - type: text
    text: La fonction F13 -- Systèmes d'Information, Automatismes et Cybersécurité définit les exigences fonctionnelles relatives
      aux infrastructures numériques, aux réseaux industriels, aux automatismes, aux systèmes de supervision et à la cybersécurité
      du Campus CEVA RHYAD.
  - type: text
    text: Elle couvre l'ensemble des systèmes nécessaires au pilotage, à la supervision, à la traçabilité et à la protection
      des installations industrielles et administratives.
  - type: text
    text: Le présent document définit les besoins fonctionnels du projet sans imposer de solution technique particulière.
  text: 'La fonction F13 -- Systèmes d''Information, Automatismes et Cybersécurité définit les exigences fonctionnelles relatives
    aux infrastructures numériques, aux réseaux industriels, aux automatismes, aux systèmes de supervision et à la cybersécurité
    du Campus CEVA RHYAD.


    Elle couvre l''ensemble des systèmes nécessaires au pilotage, à la supervision, à la traçabilité et à la protection des
    installations industrielles et administratives.


    Le présent document définit les besoins fonctionnels du projet sans imposer de solution technique particulière.'
- title: 2. Objectifs
  blocks:
  - type: list
    items:
    - fonctionnement des systèmes industriels ;
    - fonctionnement des systèmes informatiques du Campus ;
    - supervision des installations ;
    - protection des données ;
    - protection des réseaux industriels ;
    - disponibilité des systèmes critiques ;
    - continuité des activités numériques.
  bullets:
  - fonctionnement des systèmes industriels ;
