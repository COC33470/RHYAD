    text: États, alarmes, historiques, performances et disponibilité.
  text: États, alarmes, historiques, performances et disponibilité.
- title: F13-07 -- Évolutivité
  blocks:
  - type: text
    text: Extensions futures sans remise en cause majeure.
  text: Extensions futures sans remise en cause majeure.
