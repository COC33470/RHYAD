reference: CEVA-RHYAD-100-F05
title: Conditionnement et Expédition des Produits
revision: Rev1.0
status: Validated
chapters:
- title: 1. Objet
  blocks:
  - type: text
    text: La fonction F05 -- Conditionnement et Expédition des Produits définit les exigences fonctionnelles relatives au
      conditionnement, à l'étiquetage, au stockage des produits finis et à leur préparation à l'expédition au sein du Campus
      CEVA RHYAD.
  - type: text
    text: Elle couvre les opérations réalisées après la production et après la libération qualité des produits.
  - type: text
    text: Le présent document décrit exclusivement les besoins fonctionnels du projet et ne définit ni les procédés de conditionnement,
      ni les procédures qualité, ni les modes opératoires.
  text: 'La fonction F05 -- Conditionnement et Expédition des Produits définit les exigences fonctionnelles relatives au conditionnement,
    à l''étiquetage, au stockage des produits finis et à leur préparation à l''expédition au sein du Campus CEVA RHYAD.


    Elle couvre les opérations réalisées après la production et après la libération qualité des produits.


    Le présent document décrit exclusivement les besoins fonctionnels du projet et ne définit ni les procédés de conditionnement,
    ni les procédures qualité, ni les modes opératoires.'
- title: 2. Objectifs
  blocks:
  - type: text
    text: 'La fonction doit permettre :'
  - type: list
    items:
    - le conditionnement des produits finis ;
    - l'identification et l'étiquetage des produits ;
    - la préparation des expéditions ;
    - la protection des produits jusqu'à leur livraison ;
    - la traçabilité complète des lots ;
    - le maintien des conditions de conservation jusqu'au départ du site.
  text: 'La fonction doit permettre :'
  bullets:
  - le conditionnement des produits finis ;
  - l'identification et l'étiquetage des produits ;
  - la préparation des expéditions ;
  - la protection des produits jusqu'à leur livraison ;
  - la traçabilité complète des lots ;
  - le maintien des conditions de conservation jusqu'au départ du site.
- title: 3. Périmètre
  blocks:
  - type: text
    text: 'La fonction couvre notamment :'
  - type: list
    items:
    - les zones de conditionnement primaire ;
    - les zones de conditionnement secondaire ;
    - les zones d'étiquetage ;
    - les zones de contrôle avant expédition ;
    - les zones de stockage des produits finis ;
    - les zones de préparation des commandes ;
    - les zones de mise à quai.
  - type: text
    text: 'Sont exclus :'
  - type: list
    items:
    - les essais qualité ;
    - les procédures de libération des lots ;
    - les procédures logistiques du transporteur ;
    - les systèmes ERP/WMS.
  text: 'La fonction couvre notamment :


    Sont exclus :'
  bullets:
  - les zones de conditionnement primaire ;
  - les zones de conditionnement secondaire ;
  - les zones d'étiquetage ;
  - les zones de contrôle avant expédition ;
  - les zones de stockage des produits finis ;
  - les zones de préparation des commandes ;
  - les zones de mise à quai.
  - les essais qualité ;
  - les procédures de libération des lots ;
  - les procédures logistiques du transporteur ;
  - les systèmes ERP/WMS.
- title: 4. Exigences fonctionnelles
- title: F05-01 -- Protection des produits
  blocks:
  - type: text
    text: Le conditionnement doit garantir l'intégrité des produits pendant le stockage, la manutention et le transport.
  text: Le conditionnement doit garantir l'intégrité des produits pendant le stockage, la manutention et le transport.
- title: F05-02 -- Étiquetage
  blocks:
  - type: text
    text: Les installations doivent permettre l'identification fiable des produits conformément aux exigences réglementaires
      et aux exigences du Maître d'Ouvrage.
  text: Les installations doivent permettre l'identification fiable des produits conformément aux exigences réglementaires
    et aux exigences du Maître d'Ouvrage.
- title: F05-03 -- Traçabilité
  blocks:
  - type: text
    text: Chaque produit doit pouvoir être tracé depuis sa fabrication jusqu'à son expédition.
  - type: text
    text: 'Les informations suivantes doivent être disponibles :'
  - type: list
    items:
    - numéro de lot ;
    - date de conditionnement ;
    - date d'expédition ;
    - destination ;
    - opérateur.
  text: 'Chaque produit doit pouvoir être tracé depuis sa fabrication jusqu''à son expédition.


    Les informations suivantes doivent être disponibles :'
  bullets:
  - numéro de lot ;
  - date de conditionnement ;
  - date d'expédition ;
  - destination ;
  - opérateur.
- title: F05-04 -- Conditions de conservation
  blocks:
  - type: text
    text: Les produits doivent être conservés dans des conditions compatibles avec leurs exigences de stabilité jusqu'à leur
      expédition.
  text: Les produits doivent être conservés dans des conditions compatibles avec leurs exigences de stabilité jusqu'à leur
    expédition.
- title: F05-05 -- Séparation des flux
  blocks:
  - type: text
    text: 'Les flux de produits finis doivent être séparés :'
  - type: list
    items:
    - des matières premières ;
    - des déchets ;
    - des produits non libérés ;
    - des retours éventuels.
  text: 'Les flux de produits finis doivent être séparés :'
  bullets:
  - des matières premières ;
  - des déchets ;
  - des produits non libérés ;
  - des retours éventuels.
- title: F05-06 -- Sécurité
  blocks:
  - type: text
    text: 'Les installations doivent assurer :'
  - type: list
    items:
    - la protection des produits ;
    - la sécurité des opérateurs ;
    - le contrôle des accès ;
    - la prévention des erreurs de préparation.
  text: 'Les installations doivent assurer :'
  bullets:
  - la protection des produits ;
  - la sécurité des opérateurs ;
  - le contrôle des accès ;
  - la prévention des erreurs de préparation.
- title: F05-07 -- Continuité d'activité
  blocks:
  - type: text
    text: Les installations doivent permettre la poursuite des opérations de conditionnement et d'expédition des produits
      critiques en cas de défaillance d'un équipement non essentiel.
  text: Les installations doivent permettre la poursuite des opérations de conditionnement et d'expédition des produits critiques
    en cas de défaillance d'un équipement non essentiel.
