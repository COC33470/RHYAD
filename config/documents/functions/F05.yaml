- title: 6. Contraintes
  blocks:
  - type: list
    items:
    - exigences GMP/BPF ;
    - exigences de traçabilité pharmaceutique ;
    - contraintes climatiques de l'Arabie Saoudite ;
    - conditions de conservation des produits ;
    - exigences de sûreté du site ;
    - contraintes logistiques d'expédition.
  bullets:
  - exigences GMP/BPF ;
  - exigences de traçabilité pharmaceutique ;
  - contraintes climatiques de l'Arabie Saoudite ;
  - conditions de conservation des produits ;
  - exigences de sûreté du site ;
  - contraintes logistiques d'expédition.
- title: 7. Critères de performance
  blocks:
  - type: list
    items:
    - conditionnement conforme aux exigences réglementaires ;
    - traçabilité complète des produits finis ;
    - préparation fiable des expéditions ;
    - conservation maîtrisée des produits ;
    - exploitation simple et sécurisée ;
    - évolutivité compatible avec les futurs développements du Campus.
