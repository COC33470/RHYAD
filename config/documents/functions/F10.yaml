reference: CEVA-RHYAD-100-F10
title: Maintenance et Exploitation Technique
revision: Rev1.0
status: Validated
chapters:
- title: 1. Objet
  blocks:
  - type: text
    text: La fonction F10 -- Maintenance et Exploitation Technique définit les exigences fonctionnelles relatives à la maintenance
      et à l'exploitation technique des bâtiments, des laboratoires, des installations industrielles, des utilités et des
      infrastructures du Campus CEVA RHYAD.
  - type: text
    text: Cette fonction vise à garantir la disponibilité, la fiabilité et la pérennité des installations tout au long de
      leur cycle de vie.
  - type: text
    text: Le présent document traite exclusivement des exigences de conception permettant la maintenance des installations.
      Il ne définit pas l'organisation future du service maintenance ni les procédures d'exploitation.
  text: 'La fonction F10 -- Maintenance et Exploitation Technique définit les exigences fonctionnelles relatives à la maintenance
    et à l''exploitation technique des bâtiments, des laboratoires, des installations industrielles, des utilités et des infrastructures
    du Campus CEVA RHYAD.


    Cette fonction vise à garantir la disponibilité, la fiabilité et la pérennité des installations tout au long de leur cycle
    de vie.


    Le présent document traite exclusivement des exigences de conception permettant la maintenance des installations. Il ne
    définit pas l''organisation future du service maintenance ni les procédures d''exploitation.'
- title: 2. Objectifs
  blocks:
  - type: list
    items:
    - maintenance préventive ;
    - maintenance corrective ;
    - maintenance prédictive lorsque pertinente ;
    - remplacement des équipements ;
    - accès sécurisé aux installations ;
    - continuité des activités pendant la maintenance ;
    - optimisation du coût global sur le cycle de vie.
  bullets:
  - maintenance préventive ;
  - maintenance corrective ;
  - maintenance prédictive lorsque pertinente ;
  - remplacement des équipements ;
  - accès sécurisé aux installations ;
  - continuité des activités pendant la maintenance ;
  - optimisation du coût global sur le cycle de vie.
