- title: 4. Exigences fonctionnelles
- title: F10-01 -- Accessibilité
  blocks:
  - type: text
    text: Tous les équipements devront être accessibles pour l'inspection, les essais, la maintenance, le remplacement et
      les contrôles réglementaires.
  text: Tous les équipements devront être accessibles pour l'inspection, les essais, la maintenance, le remplacement et les
    contrôles réglementaires.
- title: F10-02 -- Maintenabilité
  blocks:
  - type: text
    text: Les équipements devront limiter les temps d'intervention. Les espaces techniques devront permettre le démontage
      et le remplacement.
  text: Les équipements devront limiter les temps d'intervention. Les espaces techniques devront permettre le démontage et
    le remplacement.
- title: F10-03 -- Continuité d'exploitation
  blocks:
  - type: text
    text: Les opérations de maintenance devront avoir un impact minimal. Les installations critiques devront pouvoir être
      maintenues sans interruption majeure lorsque cela est justifié.
  text: Les opérations de maintenance devront avoir un impact minimal. Les installations critiques devront pouvoir être maintenues
    sans interruption majeure lorsque cela est justifié.
- title: F10-04 -- Surveillance des équipements
  blocks:
  - type: text
    text: 'Les équipements critiques devront permettre :'
  - type: list
    items:
    - suivi d'état ;
    - alarmes ;
    - analyse des performances ;
    - aide à la maintenance prédictive.
  text: 'Les équipements critiques devront permettre :'
  bullets:
