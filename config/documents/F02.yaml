reference: RHYAD-F02
title: Gestion des décisions
subtitle: Procédure projet - Révision A1.0

chapters:
  - title: "1. Objet"
    text: >
      La présente procédure définit les règles de préparation, d'analyse, de validation,
      d'enregistrement, de communication et de suivi des décisions du projet RHYAD. Elle vise
      à garantir que les arbitrages ayant un impact sur la conception, les coûts, les délais,
      la qualité, la sécurité, les interfaces, les contrats ou l'exploitation future sont pris
      par l'autorité compétente, sur la base d'informations consolidées et traçables.
    bullets:
      - "Éviter les décisions implicites, non documentées ou prises hors gouvernance."
      - "Sécuriser les arbitrages AMO/MOE/MOA sur les sujets critiques du projet."
      - "Assurer la traçabilité entre demande de décision, analyse, validation et actions induites."
      - "Maintenir un registre unique des décisions projet dans REG-DEC."

  - title: "2. Domaine d'application"
    text: >
      La procédure s'applique à toutes les décisions nécessaires au pilotage du projet RHYAD,
      depuis les phases de cadrage et de conception jusqu'à l'exécution, la réception, le
      commissioning, le transfert documentaire et la clôture. Elle concerne la MOA, l'AMO, la
      MOE, les architectes, ingénieries, entreprises, fournisseurs, consultants, contrôleurs et
      toute partie prenante sollicitée pour avis ou validation.
    bullets:
      - "Décisions techniques relatives aux choix de conception, méthodes, équipements, performances et interfaces."
      - "Décisions planning portant sur les jalons, séquences, priorités d'exécution, phasages et mesures de rattrapage."
      - "Décisions qualité, HSE, réglementaires et documentaires nécessitant une approbation formelle."
      - "Décisions contractuelles ou financières lorsqu'elles nécessitent un arbitrage ou une instruction de la MOA."
      - "Décisions liées aux risques, changements, déviations, réserves et non-conformités majeures."

  - title: "3. Références"
    text: >
      Les références ci-dessous doivent être consultées pour assurer la cohérence entre les
      décisions, les actions, les risques, les interfaces et les livrables projet. Une décision
      validée peut déclencher des actions dans REG-ACT ou mettre à jour d'autres registres.
    bullets:
      - "DT-000 - Note de cadrage documentaire"
      - "REG-DEC - Registre des décisions"
      - "REG-ACT - Registre des actions"
      - "REG-RFI - Registre des RFI"
      - "REG-RSK - Registre des risques"
      - "REG-INT - Registre des interfaces"
      - "REG-NCR - Registre des non-conformités"
      - "F01 - Gestion des actions"
      - "F03 - Gestion des RFI"
      - "F04 - Gestion des interfaces"
      - "F05 - Gestion des risques"

  - title: "4. Définitions"
    text: >
      Les définitions suivantes permettent d'établir un vocabulaire commun. Une décision est
      un arbitrage formel qui engage le projet ; elle ne doit pas être confondue avec une
      recommandation, une hypothèse de travail ou un commentaire documentaire.
    bullets:
      - "Décision : choix validé par une autorité compétente, applicable à un périmètre défini et assorti d'une traçabilité."
      - "Demande de décision : sollicitation formelle décrivant l'objet, le contexte, les options et l'autorité attendue."
      - "Option : solution ou orientation possible soumise à comparaison avant arbitrage."
      - "Autorité de décision : personne, instance ou comité habilité à valider l'option retenue."
      - "Décision différée : décision non prise à l'échéance initiale faute d'informations, d'arbitrage ou de quorum suffisant."
      - "Effet induit : action, modification, risque, coût, délai ou communication résultant de la décision."

  - title: "5. Principes de décision"
    text: >
      Toute décision doit reposer sur une information fiable, une analyse proportionnée à son
      impact et une validation par le niveau d'autorité approprié. Les décisions ne doivent pas
      être prises par défaut, par absence de réponse ou par simple consensus informel.
    bullets:
      - "Une décision doit être formulée de manière claire, datée, applicable et vérifiable."
      - "Les impacts planning, coût, qualité, HSE, conformité et interfaces doivent être évalués avant validation."
      - "Les options rejetées doivent être mentionnées lorsque l'arbitrage est significatif."
      - "Toute réserve ou condition d'application doit être enregistrée dans REG-DEC."
      - "Les décisions critiques doivent être communiquées aux parties affectées avant mise en oeuvre."

  - title: "6. Typologie des décisions"
    text: >
      La typologie permet d'orienter les analyses et de déterminer le niveau d'autorité requis.
      Le type de décision est renseigné dès la création de l'entrée dans REG-DEC et peut être
      ajusté par l'AMO si l'impact réel évolue.
    tables:
      - title: "Types de décisions"
        headers:
          - "Type"
          - "Description"
          - "Exemples"
          - "Registre lié"
        rows:
          - ["Technique", "Choix de conception, performance, méthode ou équipement.", "Dimensionnement, technologie, implantation, standard technique.", "REG-RFI / livrables"]
          - ["Planning", "Arbitrage sur jalon, séquence ou mesure de rattrapage.", "Priorité de zone, décalage d'activité, phasage travaux.", "Planning projet"]
          - ["Coût / contrat", "Décision ayant un effet financier, contractuel ou commercial.", "Variation, provision, instruction contractuelle, réserve.", "Contrats / budget"]
          - ["Qualité", "Acceptation, reprise ou exigence qualité.", "Dérogation, NCR majeure, plan de contrôle, preuve documentaire.", "REG-NCR"]
          - ["HSE", "Arbitrage lié à la sécurité, environnement ou coactivité.", "Mesure compensatoire, arrêt partiel, condition d'accès.", "Registre HSE"]
          - ["Interface", "Décision entre lots, disciplines ou tiers.", "Limite de prestation, réservation, raccordement, responsabilité.", "REG-INT"]
          - ["Exploitation", "Choix impactant maintenance, opération, formation ou transfert.", "Accessibilité, spare parts, stratégie de qualification.", "Dossier transfert"]

  - title: "7. Gouvernance décisionnelle"
    text: >
      La gouvernance décisionnelle définit qui peut décider, à quel niveau, et sous quelles
      conditions. Elle permet d'éviter les arbitrages hors mandat et de réserver les comités
      aux sujets ayant un impact réel sur le projet.
    tables:
      - title: "Niveaux d'autorité"
        headers:
          - "Niveau"
          - "Autorité"
          - "Périmètre"
          - "Exemples de décisions"
        rows:
          - ["N1", "Pilote AMO/MOE ou responsable de lot", "Décisions opérationnelles sans impact coût, délai critique ou exigence contractuelle.", "Clarification mineure, choix d'organisation, séquence locale."]
          - ["N2", "Direction technique AMO/MOE", "Décisions techniques ou interfaces avec impact modéré.", "Option de conception, réponse technique engageante, arbitrage entre disciplines."]
          - ["N3", "Direction projet MOA / AMO", "Décisions avec impact planning, coût, contrat, qualité majeure ou priorité projet.", "Arbitrage jalon, variation potentielle, changement de stratégie."]
          - ["N4", "Comité de pilotage / sponsor", "Décisions critiques, stratégiques, budgétaires ou contractuelles majeures.", "Changement de périmètre, budget additionnel, arbitrage de risque majeur."]
    bullets:
      - "Le niveau d'autorité est proposé par le pilote et confirmé lors de la qualification."
      - "Une décision peut être escaladée si son impact dépasse le mandat initial."
      - "La MOA reste autorité finale pour les décisions engageant coût, délai contractuel ou périmètre."

  - title: "8. Cycle de vie d'une décision"
    text: >
      Le cycle de vie d'une décision doit être lisible depuis son origine jusqu'à son
      application. Un statut doit refléter l'état réel de l'arbitrage et non l'intention de le
      traiter lors d'une prochaine réunion.
    tables:
      - title: "Statuts de décision"
        headers:
          - "Statut"
          - "Signification"
          - "Condition d'entrée"
          - "Condition de sortie"
        rows:
          - ["Draft", "Demande identifiée mais non qualifiée.", "Sujet proposé ou extrait d'une réunion.", "Qualification par l'AMO/MOE."]
          - ["Under Analysis", "Analyse en cours avant arbitrage.", "Options, impacts ou avis à consolider.", "Dossier prêt pour décision ou demande de complément."]
          - ["Ready for Decision", "Dossier complet soumis à l'autorité compétente.", "Analyse et recommandation disponibles.", "Validation, rejet ou report."]
          - ["Approved", "Décision validée et applicable.", "Arbitrage formel obtenu.", "Communication et actions induites lancées."]
          - ["Rejected", "Option ou demande refusée.", "Décision négative formalisée.", "Archivage et actions éventuelles de remplacement."]
          - ["Deferred", "Décision reportée.", "Information manquante, arbitrage non disponible ou quorum insuffisant.", "Nouvelle date, responsable et conditions de reprise définis."]
          - ["Implemented", "Décision appliquée et effets suivis.", "Actions induites réalisées ou intégrées.", "Clôture de suivi dans REG-DEC."]
          - ["Cancelled", "Demande annulée ou devenue sans objet.", "Justification validée.", "Archivage avec motif."]
    bullets:
      - "Une décision Approved n'est pas automatiquement Implemented."
      - "Le statut Deferred doit toujours comporter une date cible et un responsable de relance."
      - "Toute décision Rejected doit préciser si une alternative doit être préparée."

  - title: "9. Préparation d'une décision"
    text: >
      La préparation consiste à constituer un dossier de décision proportionné à l'enjeu.
      L'objectif est de permettre à l'autorité compétente d'arbitrer sans devoir reconstituer
      le contexte ou demander des informations essentielles en séance.
    bullets:
      - "Décrire le contexte, le fait générateur et la décision attendue."
      - "Identifier les options disponibles, y compris le maintien de la situation actuelle lorsque pertinent."
      - "Présenter les avantages, inconvénients, risques et conditions d'application de chaque option."
      - "Indiquer les impacts sur coût, délai, qualité, HSE, conformité, exploitation et interfaces."
      - "Formuler une recommandation AMO/MOE lorsque l'analyse le permet."
      - "Lister les pièces justificatives : plans, notes, avis techniques, RFI, risques, devis, planning ou comptes rendus."

  - title: "10. Analyse des impacts"
    text: >
      L'analyse d'impact sécurise l'arbitrage et réduit le risque de décisions partielles.
      Elle doit être menée avant présentation au comité lorsque la décision dépasse un simple
      ajustement opérationnel.
    tables:
      - title: "Matrice d'impact"
        headers:
          - "Axe d'impact"
          - "Questions de contrôle"
          - "Niveau attendu d'analyse"
          - "Preuve attendue"
        rows:
          - ["Planning", "La décision modifie-t-elle un jalon, une séquence, une dépendance ou un chemin critique ?", "Analyse des dates affectées et des marges.", "Extrait planning ou note de séquencement."]
          - ["Coût", "La décision génère-t-elle un coût direct, une variation ou un risque financier ?", "Estimation, hypothèses et source budgétaire.", "Devis, ordre de grandeur ou note coût."]
          - ["Technique", "La décision modifie-t-elle une performance, une spécification ou une conception validée ?", "Comparaison des options et conformité aux exigences.", "Note technique, plan, calcul ou avis spécialisé."]
          - ["Qualité", "La décision affecte-t-elle une exigence qualité, un contrôle ou une preuve de conformité ?", "Vérification des critères d'acceptation.", "Plan qualité, NCR, rapport d'inspection."]
          - ["HSE", "La décision introduit-elle un risque sécurité, environnement ou coactivité ?", "Analyse de risque et mesures compensatoires.", "Avis HSE, permis, analyse de tâche."]
          - ["Interface", "La décision affecte-t-elle un autre lot, une discipline ou un tiers ?", "Consultation des parties affectées.", "Compte rendu interface ou validation croisée."]
          - ["Exploitation", "La décision impacte-t-elle maintenance, accessibilité, formation ou qualification ?", "Avis exploitation et conditions de transfert.", "Avis utilisateur, note O&M ou dossier qualification."]
    bullets:
      - "Une décision critique sans analyse d'impact documentée doit être renvoyée en préparation."
      - "Les impacts inconnus doivent être explicitement marqués comme hypothèses ou réserves."
      - "Les impacts induits doivent générer des actions dans REG-ACT."

  - title: "11. Comité de décision"
    text: >
      Le comité de décision est l'instance de validation des arbitrages nécessitant un niveau
      d'autorité supérieur ou une coordination entre plusieurs parties. Il peut être dédié ou
      intégré à une réunion de pilotage, à condition que l'ordre du jour et les décisions soient
      clairement identifiés.
    bullets:
      - "L'ordre du jour liste les décisions attendues, leur niveau d'autorité et les documents de support."
      - "Les dossiers de décision doivent être transmis avant la réunion selon le délai convenu par le projet."
      - "Le quorum et les représentants habilités sont vérifiés en début de séance."
      - "Chaque décision est formulée en séance avec option retenue, conditions, réserves et actions associées."
      - "Les décisions non prises sont classées Deferred avec motif et prochaine étape."

  - title: "12. Validation"
    text: >
      La validation formalise l'arbitrage. Elle doit être explicite et traçable. Une absence
      d'objection ne vaut pas validation sauf règle contractuelle ou procédure écrite
      spécifiquement applicable.
    bullets:
      - "Identifier l'autorité de validation et la date de décision."
      - "Renseigner l'option retenue et les conditions d'application."
      - "Mentionner les réserves, limites de validité ou hypothèses structurantes."
      - "Définir les actions induites, responsables et échéances."
      - "Mettre à jour les registres liés lorsque la décision affecte risques, interfaces, RFI, NCR ou livrables."
      - "Classer les pièces de validation dans l'espace documentaire projet."

  - title: "13. Communication"
    text: >
      Une décision validée doit être communiquée aux personnes et organisations concernées
      dans un délai compatible avec son impact. La communication doit être suffisamment claire
      pour éviter les interprétations divergentes.
    bullets:
      - "Diffuser la décision aux responsables d'actions, responsables de lots et parties affectées."
      - "Indiquer la référence REG-DEC et les documents supports applicables."
      - "Préciser la date d'application et les éventuelles conditions préalables."
      - "Mettre à jour les comptes rendus, registres et livrables impactés."
      - "Confirmer la bonne réception pour les décisions P1 ou à impact contractuel."

  - title: "14. Enregistrement dans REG-DEC"
    text: >
      REG-DEC constitue la source de vérité pour les décisions projet. Chaque entrée doit
      permettre de comprendre ce qui a été décidé, pourquoi, par qui, quand, avec quels impacts
      et quelles actions induites.
    bullets:
      - "Identifiant unique de décision."
      - "Objet, contexte, origine et demandeur."
      - "Type de décision et niveau d'autorité."
      - "Options étudiées, recommandation et option retenue."
      - "Impacts analysés et registres liés."
      - "Statut, date de validation, autorité validatrice et conditions."
      - "Actions induites, responsables, échéances et preuves de mise en oeuvre."
      - "Références documentaires et historique des mises à jour."

  - title: "15. Suivi des décisions"
    text: >
      Le suivi d'une décision ne s'arrête pas à son approbation. L'AMO/MOE doit vérifier que
      les conséquences sont prises en compte dans les actions, livrables, plannings, interfaces
      et communications projet.
    bullets:
      - "Créer ou mettre à jour les actions induites dans REG-ACT."
      - "Vérifier l'intégration dans les livrables et plans concernés."
      - "Contrôler les impacts planning et coût jusqu'à stabilisation."
      - "S'assurer que les parties affectées ont reçu et compris la décision."
      - "Passer la décision en Implemented lorsque les effets attendus sont réalisés ou intégrés."
      - "Documenter toute divergence entre décision approuvée et mise en oeuvre réelle."

  - title: "16. Décisions différées"
    text: >
      Une décision différée doit rester pilotée. Le report ne doit pas servir à masquer une
      absence d'arbitrage ou un défaut de préparation. Le motif de report et les conditions de
      reprise doivent être clairement enregistrés.
    bullets:
      - "Indiquer le motif : information manquante, analyse complémentaire, arbitrage supérieur, consultation tiers ou absence de quorum."
      - "Nommer un responsable de relance et fixer une date cible."
      - "Identifier les risques ou impacts du report."
      - "Créer les actions nécessaires pour obtenir les informations manquantes."
      - "Escalader les reports répétés sur décisions critiques."
      - "Maintenir le statut Deferred jusqu'à décision effective, rejet ou annulation."

  - title: "17. KPI"
    text: >
      Les indicateurs de décision permettent de mesurer la réactivité de la gouvernance, la
      qualité de préparation des dossiers et l'efficacité de mise en oeuvre des arbitrages.
    tables:
      - title: "Tableau KPI"
        headers:
          - "Indicateur"
          - "Définition"
          - "Cible"
          - "Fréquence"
        rows:
          - ["Décisions ouvertes", "Nombre de décisions non Approved, Rejected, Implemented ou Cancelled.", "Tendance maîtrisée", "Hebdomadaire"]
          - ["Décisions différées", "Nombre de décisions au statut Deferred.", "Analyse systématique des reports critiques", "Hebdomadaire"]
          - ["Délai moyen de décision", "Durée entre création de la demande et validation ou rejet.", "Compatible avec le niveau d'autorité", "Mensuelle"]
          - ["Décisions critiques en retard", "Décisions N3/N4 dépassant la date cible.", "Zéro sans escalade", "Hebdomadaire"]
          - ["Taux de dossiers complets", "Décisions Ready for Decision acceptées sans demande de complément majeur.", "> 90 %", "Mensuelle"]
          - ["Taux de mise en oeuvre", "Décisions Approved passées en Implemented avec actions soldées.", "> 95 %", "Mensuelle"]
    bullets:
      - "Les KPI doivent être consolidés par type, niveau d'autorité, responsable et statut."
      - "Toute dérive sur les décisions critiques doit être présentée en comité de pilotage."
      - "Les causes de report récurrentes doivent alimenter les actions d'amélioration du processus."

  - title: "18. Annexes"
    text: >
      Les annexes définissent les informations minimales et les règles pratiques à appliquer
      pour assurer une exploitation homogène de REG-DEC. Elles peuvent être enrichies par le
      projet sans modifier la logique de la procédure.
    bullets:
      - "Annexe A - Champs minimaux REG-DEC : identifiant, date, origine, objet, type, niveau d'autorité, demandeur, options, recommandation, décision, statut, impacts, actions induites, autorité, preuves."
      - "Annexe B - Format d'identifiant recommandé : DEC-YYYY-NNNN ou préfixe équivalent défini par le projet."
      - "Annexe C - Modèle de formulation : Il est décidé de [option retenue], applicable à [périmètre], sous réserve de [conditions], avec effet au [date]."
      - "Annexe D - Exemples de preuves : procès-verbal signé, compte rendu approuvé, note de décision, courriel d'autorité habilitée, instruction contractuelle, visa de livrable."
      - "Annexe E - Règle d'archivage : toute décision N3/N4 doit être associée à un dossier support conservé dans l'espace documentaire projet."
