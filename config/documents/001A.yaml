reference: "001A"
title: "Analyse de Contexte et d’Adaptation du Projet (ACAP)"
subtitle: "CEVA – Campus de Production d’Autovaccins – Royaume d’Arabie Saoudite"
status: "Working Draft"
revision: "Rev.0.1"

chapters:
  - title: "1. Objet"
    text: >
      Le présent document a pour objet d’analyser le contexte local dans lequel sera implanté
      le projet et d’identifier les adaptations nécessaires afin de garantir la réussite de sa
      conception, de sa réalisation et de son exploitation.

      Il constitue une donnée d’entrée pour le Programme Fonctionnel, les Design Basis et les
      études de conception.

  - title: "2. Présentation générale du projet"
    text: >
      Projet : Campus de production d’autovaccins vétérinaires.

      Client : CEVA Santé Animale.

      Localisation : Royaume d’Arabie Saoudite.

      Objectif :

      Créer un site de production évolutif permettant une montée en capacité de 100–300 L vers
      1000 L tout en respectant les exigences réglementaires, techniques et opérationnelles
      locales.

