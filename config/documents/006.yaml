reference: CEVA-RHYAD-006-PDD
title: Plan Directeur Documentaire
revision: Rev1.0
status: Validated
chapters:
- title: 1. Objet
  text: 'Le présent document définit l''organisation documentaire du projet RHYAD.


    Il constitue le référentiel de gestion des documents produits pendant la

    programmation, la conception, la réalisation et la clôture du projet.


    Il garantit :'
  bullets:
  - une structure documentaire unique ;
  - une gestion cohérente des versions ;
  - la traçabilité des modifications ;
  - la maîtrise des interfaces documentaires.
- title: 2. Domaine d'application
  text: 'Le présent plan s''applique à l''ensemble des documents produits dans le

    cadre du projet RHYAD.


    Il couvre :'
  bullets:
  - les documents de gouvernance ;
  - les documents fonctionnels ;
  - les données techniques ;
  - les Design Basis ;
  - les réunions ;
  - les registres ;
  - les dossiers d'études.
- title: 3. Principes documentaires
  text: 'La gestion documentaire RHYAD repose sur les principes suivants :'
  bullets:
  - une information = une seule source ;
  - un document = une responsabilité identifiée ;
  - une modification = une analyse des impacts documentaires ;
  - une décision = une traçabilité complète ;
  - une version = un historique conservé.
- title: 4. Arborescence documentaire officielle
- title: 000 --- Gouvernance Projet
  bullets:
  - CEVA-RHYAD-001-CHARTE
  - CEVA-RHYAD-001A-ACAP
  - CEVA-RHYAD-002-PF
