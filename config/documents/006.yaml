- title: 5. Convention de nommage
  text: 'Chaque document suit la convention :


    `CEVA-RHYAD-XXX-YYY`


    Exemples :'
  bullets:
  - CEVA-RHYAD-100-F09
  - CEVA-RHYAD-200-F09-DT01
  - CEVA-RHYAD-300-DB04
  - CEVA-RHYAD-500-REG02
- title: 6. Cycle de vie documentaire
  bullets:
  - Création
  - Rédaction
  - Revue
  - Validation
  - Publication
  - Révision
  - Archivage
  text: Chaque évolution est historisée.
- title: 7. Gestion des versions
  text: 'Chaque document comporte :


    Les versions obsolètes sont archivées et restent consultables.'
  bullets:
  - une référence ;
  - une version ;
  - un statut ;
  - une date ;
  - un historique des révisions.
- title: 8. Gestion des responsabilités
  text: 'Chaque document identifie :'
  bullets:
  - son rédacteur ;
  - son relecteur ;
  - son valideur ;
  - son responsable documentaire.
- title: 9. Gestion des interfaces documentaires
  text: 'Chaque document identifie :'
  bullets:
  - ses documents d'entrée ;
  - ses documents de sortie ;
  - les documents liés ;
  - les documents impactés par une modification.
- title: 10. Gestion des impacts documentaires
  text: 'Toute modification d''un document entraîne une analyse des impacts.


    Les documents impactés sont :'
  bullets:
  - identifiés ;
  - mis à jour ;
  - tracés dans le Registre des Décisions.
- title: 11. Source documentaire unique
  text: 'Les documents sources sont conservés dans le dépôt RHYAD.


    Les formats DOCX et PDF sont des livrables générés automatiquement à

    partir des fichiers sources.


    Les documents générés ne constituent jamais la source de référence.'
- title: 12. Qualité documentaire
  text: 'Chaque document doit respecter :'
  bullets:
  - cohérence documentaire ;
  - absence de duplication ;
  - traçabilité des décisions ;
  - lisibilité ;
  - homogénéité de présentation ;
  - respect de la méthode RHYAD.
- title: 13. Règles de gestion
  bullets:
  - Une information n'est présente qu'une seule fois dans le référentiel.
  - Toute modification est propagée vers les documents concernés.
  - Toute décision est enregistrée dans le Registre des Décisions.
  - Toute évolution documentaire est historisée.
  - Les documents générés (DOCX, PDF) ne sont jamais modifiés directement.
  - Le dépôt RHYAD constitue la source documentaire officielle du projet.
- title: 14. Annexes
- title: Annexe A --- Arborescence documentaire
  text: Représentation graphique de l'organisation documentaire RHYAD.
- title: Annexe B --- Workflow documentaire
  text: Description du cycle de validation des documents.
- title: Annexe C --- Historique des révisions
  text: Suivi des versions du Plan Directeur Documentaire.
- title: Fin du document
