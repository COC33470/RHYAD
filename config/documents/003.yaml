  - title: "5. Définitions techniques"
    tables:
      - title: "Définitions techniques"
        headers:
          - "Terme"
          - "Définition"
          - "Source"
          - "Statut"
        rows:
          - ["Campus", "Ensemble des bâtiments, infrastructures, réseaux et espaces extérieurs constituant le projet RHYAD.", "RHYAD", "Validé"]
          - ["Coque climatique", "Volume bâti maintenu à des conditions climatiques maîtrisées servant d’enveloppe aux modules GMP.", "RHYAD", "Validé"]
          - ["Module GMP", "Ensemble fonctionnel de production répondant aux exigences GMP/BPF et disposant de ses propres équipements techniques (CTA, utilités, etc.).", "RHYAD", "Validé"]
          - ["Salle blanche", "Local dont la contamination particulaire et microbiologique est maîtrisée conformément aux exigences GMP/BPF.", "GMP", "Validé"]
          - ["Infrastructure critique", "Installation, équipement ou système dont la défaillance peut entraîner un arrêt de production, une perte de conformité GMP, une atteinte à la sécurité, à la sûreté ou une interruption significative de l’exploitation.", "RHYAD", "Validé"]
          - ["Continuité d’activité", "Capacité à maintenir les fonctions essentielles malgré une défaillance ou un événement perturbateur.", "RHYAD", "Validé"]
          - ["Résilience", "Capacité d’un système à maintenir ou retrouver un fonctionnement acceptable après une perturbation.", "RHYAD", "Validé"]
          - ["Défense en profondeur", "Mise en œuvre de plusieurs niveaux de protection indépendants afin de réduire les risques.", "RHYAD", "Validé"]
          - ["Redondance", "Duplication partielle ou totale d’un équipement ou d’un système afin d’assurer la continuité de service.", "RHYAD", "Validé"]
          - ["Disponibilité", "Aptitude d’un système à être opérationnel lorsqu’il est sollicité.", "RHYAD", "Validé"]
          - ["Mode dégradé", "Fonctionnement temporaire avec des performances réduites tout en maintenant les fonctions essentielles.", "RHYAD", "Validé"]
          - ["Design Driver", "Facteur de conception orientant les choix techniques et servant de critère d’évaluation des variantes.", "RHYAD", "Validé"]

  - title: "6. Principes méthodologiques RHYAD"
    text: "Cette section constitue un index des principes méthodologiques détaillés dans CEVA-RHYAD-000-MTH01."
    tables:
      - title: "Principes méthodologiques RHYAD"
        headers:
          - "Référence"
          - "Intitulé"
        rows:
          - ["P-001", "Une information = une seule source"]
          - ["P-002", "Les documents RHYAD définissent les exigences de conception et non les procédures d’exploitation"]
          - ["P-003", "Toute solution technique doit être justifiée par une analyse de variantes"]
          - ["P-004", "Toute décision identifie les impacts documentaires associés"]
          - ["P-005", "Les infrastructures critiques sont identifiées par une analyse de risques"]

  - title: "7. Terminologie spécifique CEVA"
    text: >
      Cette section est réservée aux définitions spécifiques au Groupe CEVA.

      Elle sera enrichie au fur et à mesure des ateliers de programmation et des échanges avec
      les équipes CEVA.

  - title: "8. Références normatives"
    text: "Cette section recense les principaux référentiels utilisés dans le projet."
    tables:
      - title: "Références normatives"
        headers:
          - "Référence"
          - "Intitulé"
        rows:
          - ["GMP / EU GMP", "Good Manufacturing Practices"]
          - ["WHO GMP", "World Health Organization – Good Manufacturing Practices"]
          - ["ISO 14644", "Salles propres et environnements maîtrisés apparentés"]
          - ["ISO 55000", "Management des actifs"]
          - ["ISO 27001", "Management de la sécurité de l’information"]
          - ["IEC 62443", "Cybersécurité des systèmes industriels"]
          - ["ISO 22301", "Management de la continuité d’activité"]
          - ["ISO 50001", "Management de l’énergie"]

  - title: "9. Règles de gestion"
    bullets:
      - "Toute nouvelle définition est ajoutée au Glossaire avant d’être utilisée dans un autre document."
      - "Une définition ne peut exister qu’à un seul endroit dans le référentiel RHYAD."
      - "Les autres documents font référence au Glossaire et ne recopient pas les définitions."
      - "Toute modification du Glossaire est enregistrée dans le CEVA-RHYAD-005-REGISTRE DES DECISIONS – Registre des Décisions."
      - "Les termes spécifiques CEVA sont validés avec le Maître d’Ouvrage avant diffusion."
      - "Les principes méthodologiques sont détaillés exclusivement dans CEVA-RHYAD-000-MTH01."
      - "knowledge/glossary.yaml est la source unique de vérité."
      - "Le cycle documentaire RHYAD est : Draft → Review → Validated → Published → Obsolete."
