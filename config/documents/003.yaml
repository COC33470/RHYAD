reference: "CEVA-RHYAD-003-GLOSSAIRE"
title: "Glossaire"
revision: "Rev0.1"
status: "Validated"

chapters:
  - title: "1. Objet"
    text: >
      Le présent document constitue la référence terminologique unique du projet RHYAD.

      Il définit les acronymes, les termes techniques, les concepts méthodologiques et les
      définitions spécifiques au projet afin de garantir une compréhension commune entre le
      Maître d’Ouvrage, l’AMO, les bureaux d’études, les entreprises et les autorités.

      Principe RHYAD :

      Un terme = une définition = une seule source.

      Aucun autre document RHYAD ne doit redéfinir un terme présent dans ce glossaire.

  - title: "2. Domaine d’application"
    text: "Le présent glossaire s’applique à l’ensemble des documents RHYAD :"
    bullets:
      - "Gouvernance (000)"
      - "Programme Fonctionnel (100)"
      - "Données Techniques (200)"
      - "Design Basis (300)"
      - "Réunions (400)"
      - "Registres (500)"
      - "Dossiers d’études (600)"

  - title: "3. Structure du glossaire"
    text: "Le glossaire est organisé en cinq familles :"
    bullets:
      - "Acronymes"
      - "Définitions techniques"
      - "Principes méthodologiques RHYAD"
      - "Terminologie spécifique CEVA"
      - "Références normatives"

