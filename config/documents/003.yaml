  - Toute nouvelle définition est ajoutée au Glossaire avant d’être utilisée dans un autre document.
  - Une définition ne peut exister qu’à un seul endroit dans le référentiel RHYAD.
  - Les autres documents font référence au Glossaire et ne recopient pas les définitions.
  - Toute modification du Glossaire est enregistrée dans le CEVA-RHYAD-000-005 – Registre des Décisions.
  - Les termes spécifiques CEVA sont validés avec le Maître d’Ouvrage avant diffusion.
  - Les principes méthodologiques sont détaillés exclusivement dans CEVA-RHYAD-000-MTH01.
