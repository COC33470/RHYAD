reference: CEVA-RHYAD-003-GLOSSAIRE
title: Glossaire
revision: Rev0.1
chapters:
- title: Contenu
  text: "Parfait. Voici la version consolidée du document CEVA-RHYAD-000-003 – Glossaire. Elle est prête à être intégrée dans\
    \ le dépôt RHYAD (YAML), sans mise en forme DOCX.\n\n⸻\n\nCEVA-RHYAD-000-003\n\nGlossaire\n\nVersion : V0.1\nStatut :\
    \ Validé – Base documentaire\nRéférence : CEVA-RHYAD-000-003\n\n⸻\n\nLe présent document constitue la référence terminologique\
    \ unique du projet RHYAD.\n\nIl définit les acronymes, les termes techniques, les concepts méthodologiques et les définitions\
    \ spécifiques au projet afin de garantir une compréhension commune entre le Maître d’Ouvrage, l’AMO, les bureaux d’études,\
    \ les entreprises et les autorités.\n\nPrincipe RHYAD :\n\nUn terme = une définition = une seule source.\n\nAucun autre\
    \ document RHYAD ne doit redéfinir un terme présent dans ce glossaire.\n\n⸻\n\nLe présent glossaire s’applique à l’ensemble\
    \ des documents RHYAD :\n\n⸻\n\nLe glossaire est organisé en cinq familles :\n\n⸻\n\nAcronyme\tDéfinition\nACAP\tAnalyse\
    \ de Contexte et d’Adaptation du Projet\nAMO\tAssistance à Maîtrise d’Ouvrage\nAPD\tAvant-Projet Détaillé\nAPS\tAvant-Projet\
    \ Sommaire\nBESS\tBattery Energy Storage System\nBIM\tBuilding Information Modeling\nBMS\tBuilding Management System\n\
    CAPEX\tCapital Expenditure\nCTA\tCentrale de Traitement d’Air\nDCE\tDossier de Consultation des Entreprises\nDOE\tDossier\
    \ des Ouvrages Exécutés\nDT\tDonnées Techniques\nEXE\tÉtudes d’Exécution\nGMAO\tGestion de Maintenance Assistée par Ordinateur\n\
    GMP / BPF\tGood Manufacturing Practices / Bonnes Pratiques de Fabrication\nGTB\tGestion Technique du Bâtiment\nHVAC /\
    \ CVC\tHeating, Ventilation and Air Conditioning / Chauffage Ventilation Climatisation\nIT\tInformation Technology\nLIMS\t\
    Laboratory Information Management System\nMES\tManufacturing Execution System\nMOA\tMaîtrise d’Ouvrage\nMOE\tMaîtrise\
    \ d’Œuvre\nOPEX\tOperational Expenditure\nOT\tOperational Technology\nPCA\tPlan de Continuité d’Activité\nPLC\tProgrammable\
    \ Logic Controller\nPRA\tPlan de Reprise d’Activité\nPRO\tÉtudes de Projet\nPW\tPurified Water (Eau Purifiée)\nQC\tQuality\
    \ Control\nSCADA\tSupervisory Control And Data Acquisition\nSD-WAN\tSoftware Defined Wide Area Network\nSOP\tStandard\
    \ Operating Procedure\nTCO\tTotal Cost of Ownership\nUPS\tUninterruptible Power Supply\nVISA\tVisa des études d’exécution\n\
    WFI / PPI\tWater For Injection / Eau pour Préparations Injectables\n\n⸻\n\nTerme\tDéfinition\tSource\tStatut\nCampus\t\
    Ensemble des bâtiments, infrastructures, réseaux et espaces extérieurs constituant le projet RHYAD.\tRHYAD\tValidé\nCoque\
    \ climatique\tVolume bâti maintenu à des conditions climatiques maîtrisées servant d’enveloppe aux modules GMP.\tRHYAD\t\
    Validé\nModule GMP\tEnsemble fonctionnel de production répondant aux exigences GMP/BPF et disposant de ses propres équipements\
    \ techniques (CTA, utilités, etc.).\tRHYAD\tValidé\nSalle blanche\tLocal dont la contamination particulaire et microbiologique\
    \ est maîtrisée conformément aux exigences GMP/BPF.\tGMP\tValidé\nInfrastructure critique\tInstallation, équipement ou\
    \ système dont la défaillance peut entraîner un arrêt de production, une perte de conformité GMP, une atteinte à la sécurité,\
    \ à la sûreté ou une interruption significative de l’exploitation.\tRHYAD\tValidé\nContinuité d’activité\tCapacité à maintenir\
    \ les fonctions essentielles malgré une défaillance ou un événement perturbateur.\tRHYAD\tValidé\nRésilience\tCapacité\
    \ d’un système à maintenir ou retrouver un fonctionnement acceptable après une perturbation.\tRHYAD\tValidé\nDéfense en\
    \ profondeur\tMise en œuvre de plusieurs niveaux de protection indépendants afin de réduire les risques.\tRHYAD\tValidé\n\
    Redondance\tDuplication partielle ou totale d’un équipement ou d’un système afin d’assurer la continuité de service.\t\
    RHYAD\tValidé\nDisponibilité\tAptitude d’un système à être opérationnel lorsqu’il est sollicité.\tRHYAD\tValidé\nMode\
    \ dégradé\tFonctionnement temporaire avec des performances réduites tout en maintenant les fonctions essentielles.\tRHYAD\t\
    Validé\nDesign Driver\tFacteur de conception orientant les choix techniques et servant de critère d’évaluation des variantes.\t\
    RHYAD\tValidé\n\n⸻\n\nCette section constitue un index des principes méthodologiques détaillés dans CEVA-RHYAD-000-MTH01.\n\
    \nRéférence\tIntitulé\nP-001\tUne information = une seule source\nP-002\tLes documents RHYAD définissent les exigences\
    \ de conception et non les procédures d’exploitation\nP-003\tToute solution technique doit être justifiée par une analyse\
    \ de variantes\nP-004\tToute décision identifie les impacts documentaires associés\nP-005\tLes infrastructures critiques\
    \ sont identifiées par une analyse de risques\n\n⸻\n\nCette section est réservée aux définitions spécifiques au Groupe\
    \ CEVA.\n\nElle sera enrichie au fur et à mesure des ateliers de programmation et des échanges avec les équipes CEVA.\n\
    \n⸻\n\nCette section recense les principaux référentiels utilisés dans le projet.\n\nRéférence\tIntitulé\nGMP / EU GMP\t\
    Good Manufacturing Practices\nWHO GMP\tWorld Health Organization – Good Manufacturing Practices\nISO 14644\tSalles propres\
    \ et environnements maîtrisés apparentés\nISO 55000\tManagement des actifs\nISO 27001\tManagement de la sécurité de l’information\n\
    IEC 62443\tCybersécurité des systèmes industriels\nISO 22301\tManagement de la continuité d’activité\nISO 50001\tManagement\
    \ de l’énergie\n\n⸻\n\n⸻\n\nDécision\n\nJe considère cette version comme la version Alpha du Glossaire RHYAD. Elle est\
    \ suffisamment mature pour être intégrée dans le logiciel RHYAD et servira désormais de référentiel terminologique unique\
    \ pour tous les développements et tous les futurs documents du projet."
