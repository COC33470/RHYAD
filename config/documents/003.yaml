chapters:
  - title: "1. Objet"
    text: >
      Le présent document définit la structure du glossaire RHYAD-CEVA.

      Le contenu terminologique est alimenté progressivement depuis knowledge/glossary.yaml,
      après validation des termes, acronymes et définitions.

  - title: "2. Domaine d'application"
    text: >
      Le glossaire couvre la terminologie applicable aux documents RHYAD du projet.

  - title: "3. Règles d'utilisation"
    text: >
      Aucun terme, acronyme ou définition n'est intégré sans validation préalable.

      Les données validées sont destinées à être consolidées dans knowledge/glossary.yaml.

