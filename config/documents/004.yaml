- title: 7. Risques issus de l’ACAP
  text: 'Cette section recense les risques identifiés dans l’Analyse de Contexte et d’Adaptation du Projet.


    Exemples :'
  bullets:
  - climat désertique ;
  - températures extrêmes ;
  - tempêtes de sable ;
  - disponibilité de l’eau ;
  - qualité et stabilité du réseau électrique ;
  - contraintes réglementaires locales ;
  - disponibilité des compétences ;
  - chaîne logistique ;
  - contexte géopolitique.
- title: 8. Risques techniques
  text: 'Cette section regroupe les risques liés aux disciplines techniques :'
  bullets:
  - Process ;
  - Architecture ;
  - CVC / HVAC ;
  - Utilités ;
  - Électricité ;
  - IT / OT ;
  - Instrumentation ;
  - Infrastructures critiques.
- title: 9. Risques documentaires
  text: 'Cette section est spécifique à la méthode RHYAD.


    Elle couvre notamment :'
  bullets:
  - incohérence documentaire ;
  - duplication d’information ;
  - absence de traçabilité ;
  - absence de validation ;
  - interfaces non identifiées ;
  - impacts documentaires non propagés.
- title: 10. Risques liés aux interfaces
  text: 'Le registre recense les risques liés aux interfaces entre disciplines :'
  bullets:
  - Process ↔ Architecture ;
  - Process ↔ CVC ;
  - CVC ↔ Utilités ;
  - Utilités ↔ Électricité ;
  - Électricité ↔ IT / OT ;
  - Maintenance ↔ Architecture ;
  - Sécurité ↔ IT / OT ;
  - Architecture ↔ Logistique.
- title: 11. Traitement des risques
  text: 'Pour chaque risque devront être précisés :'
  bullets:
  - mesure d’évitement ;
  - mesure de réduction ;
  - mesure de transfert ;
  - mesure d’acceptation ;
  - risque résiduel.
- title: 12. Liens documentaires
  text: 'Chaque risque devra référencer :'
  bullets:
  - le Programme Fonctionnel concerné ;
  - le DT concerné ;
  - le Design Basis concerné ;
  - les décisions associées ;
  - les actions associées.
- title: 13. Règles de gestion
  bullets:
  - Chaque risque possède un identifiant unique.
  - Un risque n’est décrit qu’une seule fois.
  - Les autres documents référencent le présent registre.
  - Toute modification du registre est enregistrée dans le CEVA-RHYAD-005-REGISTRE DES DECISIONS.
  - 'Les risques sont revus à chaque jalon du projet : APS, APD, PRO, DCE, EXE, Mise en service.'
  - Les risques sont mis à jour après chaque réunion de projet ayant un impact sur leur évaluation ou leur traitement.
- title: 14. Annexes
- title: Annexe A — Matrice de criticité
  text: Matrice graphique Probabilité × Gravité (5 × 5).
- title: Annexe B — Historique des révisions
  text: Suivi des versions du registre.
- title: Fin du document
