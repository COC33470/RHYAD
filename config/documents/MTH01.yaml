reference: CEVA-RHYAD-000-MTH01
title: Guide Méthodologique RHYAD
revision: Rev1.0
status: Validated
chapters:
- title: 1. Objet
  text: 'Le present document definit la methode RHYAD appliquee aux missions de programmation, d''assistance a maitrise d''ouvrage
    (AMO) et de conception de projets industriels.


    Il decrit les principes methodologiques, les regles documentaires et les processus de travail permettant de garantir la
    coherence, la tracabilite et la qualite des livrables.


    Il constitue le referentiel commun de tous les intervenants du projet.'
- title: 2. Domaine d'application
  text: 'La methode RHYAD s''applique :'
  bullets:
  - aux etudes de programmation ;
  - aux missions d'AMO ;
  - aux etudes de conception ;
  - aux projets industriels complexes ;
  - aux projets pharmaceutiques ;
  - aux futurs projets utilisant la methode RHYAD.
- title: 3. Philosophie RHYAD
  text: 'La methode RHYAD repose sur les principes suivants :


    La methode privilegie :'
  bullets:
  - une information = une seule source ;
  - une decision = une justification ;
  - une modification = un impact documentaire identifie ;
  - une variante = une analyse multicritere ;
  - une exigence = un document de reference.
  - la simplicite ;
  - la tracabilite ;
  - la robustesse documentaire ;
  - l'ingenierie collaborative ;
  - l'aide a la decision.
- title: 4. Organisation documentaire
- title: 000 - Gouvernance
  text: Pilotage du projet.
- title: 100 - Programme Fonctionnel
  text: Definition des besoins.
- title: 200 - Donnees Techniques
  text: Collecte des donnees necessaires aux etudes.
- title: 300 - Design Basis
  text: Definition des principes de conception.
- title: 400 - Reunions
  text: Pilotage des ateliers et des decisions.
- title: 500 - Registres Projet
  text: Suivi dynamique du projet.
- title: 600 - Dossiers d'Etudes
  text: Livrables techniques.
- title: 5. Principes methodologiques RHYAD
- title: P-001 - Une information = une seule source
  text: 'Chaque information est definie une seule fois.


    Les autres documents y font reference.'
- title: P-002 - Perimetre documentaire
  text: 'Les documents RHYAD definissent les exigences de programmation et de conception.


    Ils ne decrivent pas :'
  bullets:
  - les procedures d'exploitation ;
  - les SOP ;
  - les procedures de maintenance ;
  - les procedures qualite de l'exploitant.
- title: P-003 - Justification des choix
  text: 'Aucune solution technique ne peut etre retenue sans justification.


    Les variantes etudiees sont documentees.


    Le choix est motive.'
- title: P-004 - Impacts documentaires
  text: 'Toute modification identifie :'
  bullets:
  - les documents impactes ;
  - les risques impactes ;
  - les decisions impactees ;
  - les actions associees.
- title: P-005 - Infrastructures critiques
  text: 'Les infrastructures critiques sont identifiees par une analyse de risques.


    Leur niveau de redondance, de disponibilite et de protection est justifie.'
- title: 6. Processus RHYAD
  text: 'Le processus RHYAD decrit le cheminement methodologique d''un projet depuis l''expression du besoin jusqu''a la remise
    du Dossier des Ouvrages Executes (DOE).


    Chaque etape produit des livrables valides avant le passage a la suivante. Les decisions prises a chaque jalon sont enregistrees
    dans les registres du projet et leurs impacts documentaires sont propages dans l''ensemble du referentiel RHYAD.


    **Insérer ici la figure :**

    **FIG-MTH-001 - Processus RHYAD**'
- title: Legende du processus
- title: Phase 1 - Definition du besoin
  text: '**01 - Programme Fonctionnel**


    **02 - Donnees Techniques**


    **03 - Design Drivers**'
  bullets:
  - Definition des besoins, des objectifs et des exigences fonctionnelles.
  - 'Reference : **CEVA-RHYAD-002-PF**'
  - Collecte et structuration des donnees techniques necessaires aux etudes.
  - Definition des objectifs de conception et des criteres d'evaluation des variantes.
  - 'Reference : **Série CEVA-RHYAD-300-DBxx (Design Basis)**'
- title: Phase 2 - Conception
  text: '**04 - Design Basis**


    **05 - APS**


    **06 - APD**


    **07 - PRO**'
  bullets:
  - Definition des principes de conception par discipline.
  - Analyse des variantes.
  - Validation des orientations techniques.
- title: Phase 3 - Consultation et realisation
  text: '**08 - DCE**


    **09 - EXE**'
- title: Phase 4 - Cloture
  text: '**10 - DOE**'
- title: Principes transversaux du processus
  text: 'Les principes suivants s''appliquent a toutes les etapes :'
  bullets:
  - 'Tracabilite : chaque decision est enregistree et historisee.'
  - 'Validation : aucun livrable ne passe a l''etape suivante sans validation.'
  - 'Collaboration : toutes les disciplines travaillent sur une source documentaire unique.'
  - 'Amelioration continue : les retours d''experience enrichissent la methode RHYAD.'
- title: 7. Gestion des interfaces
  text: 'Chaque document doit identifier :


    Les interfaces entre disciplines doivent etre identifiees des les premieres phases de conception afin de limiter les incoherences
    techniques, les oublis et les conflits de responsabilite.


    Chaque interface identifiee doit pouvoir etre tracee jusqu''aux documents concernes, aux decisions associees et, lorsque
    cela est pertinent, aux risques et actions du projet.'
  bullets:
  - ses donnees d'entree ;
  - ses donnees de sortie ;
  - les documents lies ;
  - les disciplines concernees ;
  - les impacts documentaires.
- title: 8. Design Drivers
  text: 'Les Design Drivers representent les objectifs qui orientent la conception.


    Ils sont definis avant toute etude de variantes.


    Ils servent de base a l''evaluation des solutions techniques.


    Chaque Design Basis definit ses Design Drivers specifiques.


    Les Design Drivers peuvent notamment porter sur :


    Ils constituent les criteres de reference pour l''analyse multicritere des variantes.'
  bullets:
  - la conformite reglementaire ;
  - la qualite pharmaceutique ;
  - la securite des personnes ;
  - la securite des installations ;
  - la continuite d'activite ;
  - la disponibilite des installations ;
  - la maintenabilite ;
  - l'evolutivite ;
  - les performances energetiques ;
  - les couts d'investissement (CAPEX) ;
  - les couts d'exploitation (OPEX) ;
  - la durabilite ;
  - les contraintes du contexte local.
- title: 9. Analyse des variantes
  text: Toute variante est etudiee selon une methode commune.
- title: Etapes
  bullets:
  - Identification du besoin.
  - Definition des variantes.
  - Identification des Design Drivers.
  - Proposition des ponderations.
  - Validation des ponderations par le Maitre d'Ouvrage.
  - Analyse multicritere.
  - Justification du choix.
  - Enregistrement de la decision.
  - son objectif ;
  - ses avantages ;
  - ses inconvenients ;
  - ses impacts techniques ;
  - ses impacts reglementaires ;
  - ses impacts economiques ;
  - ses impacts sur l'exploitation ;
  - ses impacts sur la maintenance ;
  - ses impacts sur les performances energetiques ;
  - ses impacts documentaires.
  text: 'Chaque variante etudiee doit presenter :


    Les conclusions de l''analyse sont consignees dans les documents concernes et les decisions retenues sont enregistrees
    dans le Registre des Decisions.'
- title: 10. Matrice d'aide a la decision
  text: 'Les variantes sont comparees a l''aide d''une matrice multicritere.


    Les criteres sont issus des Design Drivers.


    Les ponderations :


    La matrice constitue un outil d''aide a la decision et ne remplace pas le jugement technique.


    Les criteres peuvent notamment couvrir :


    Les resultats de la matrice sont presentes de maniere transparente afin de justifier le choix retenu.'
  bullets:
  - sont proposees par l'equipe projet ;
  - sont validees par le Maitre d'Ouvrage ;
  - peuvent varier selon le sujet etudie.
  - conformite reglementaire ;
  - performances techniques ;
  - qualite ;
  - disponibilite ;
  - maintenabilite ;
  - evolutivite ;
  - securite ;
  - cybersecurite ;
  - impact environnemental ;
  - CAPEX ;
  - OPEX ;
  - TCO ;
  - consommation energetique ;
  - facilite d'exploitation ;
  - delai de realisation.
- title: 11. Gestion documentaire
  text: 'Chaque document possede :


    Tous les documents utilisent le modele documentaire RHYAD.


    Chaque evolution documentaire est soumise a une revue puis a une validation avant diffusion.


    Les documents lies sont identifies afin de garantir la coherence du referentiel documentaire.


    Les livrables DOCX et PDF sont générés à partir de la source documentaire validée conformément à la méthode RHYAD.'
  bullets:
  - une reference unique ;
  - une version ;
  - un statut documentaire ;
  - un historique des revisions ;
  - un responsable.
- title: 12. Gestion des decisions
  text: 'Toute decision :


    Chaque decision comporte notamment :


    Une decision validee devient une donnee d''entree pour les phases suivantes du projet.'
  bullets:
  - possede un identifiant unique ;
  - est enregistree dans le Registre des Decisions ;
  - reference les documents impactes ;
  - est propagee dans les documents concernes.
  - son objet ;
  - son contexte ;
  - sa justification ;
  - son auteur ;
  - son valideur ;
  - sa date ;
  - les documents concernes ;
  - les risques concernes ;
  - les actions associees ;
  - les impacts documentaires.
- title: 13. Gestion des risques
  text: 'Les risques :


    Chaque risque est :


    Les mesures de maitrise sont documentees et leur efficacite est revue aux principaux jalons du projet.


    Les risques ayant un impact sur plusieurs disciplines doivent etre partages entre les equipes concernees afin de garantir
    une approche coherente.'
  bullets:
  - sont identifies dans les Donnees Techniques et dans l'ACAP ;
  - sont centralises dans le Registre des Risques ;
  - sont suivis jusqu'a leur cloture.
  - identifie ;
  - analyse ;
  - evalue ;
  - traite ;
  - suivi.
- title: 14. Ateliers RHYAD
  text: 'Les ateliers RHYAD constituent le principal outil de concertation, de validation et d''aide a la decision du projet.


    Ils permettent :


    Les principaux ateliers sont :


    Chaque atelier fait l''objet :


    Les conclusions des ateliers alimentent directement les documents du referentiel RHYAD.'
  bullets:
  - de recueillir les besoins du Maitre d'Ouvrage ;
  - de consolider les exigences fonctionnelles ;
  - de coordonner les disciplines ;
  - de valider les hypotheses de conception ;
  - de preparer les decisions du projet ;
  - d'identifier les risques et les interfaces.
  - Atelier de lancement ;
  - Atelier fonctionnel ;
  - Atelier technique ;
  - Atelier Design Drivers ;
  - Atelier d'analyse des variantes ;
  - Atelier de validation des Design Basis ;
  - Revues APS ;
  - Revues APD ;
  - Revues PRO.
  - d'un ordre du jour ;
  - d'un support de presentation si necessaire ;
  - d'un compte rendu ;
  - d'une liste d'actions ;
  - d'une mise a jour des decisions et des risques lorsque cela est applicable.
- title: 15. Cycle de validation documentaire
  text: 'Chaque document suit le cycle documentaire suivant :


    **Draft → Review → Validated → Published → Obsolete**


    Chaque changement de statut est associe a une validation formelle.


    Les principaux statuts sont definis comme suit :


    Toute evolution entraine :'
  tables:
  - headers:
    - Statut
    - Description
    rows:
    - - Draft
      - Document en cours de redaction.
    - - Review
      - Document soumis a revue.
    - - Validated
      - Document valide pour utilisation dans le projet.
    - - Published
      - Document officiellement diffuse.
    - - Obsolete
      - Document remplace ou retire de l'utilisation.
    title: 15. Cycle de validation documentaire
  bullets:
  - une mise a jour de l'historique des revisions ;
  - une verification des impacts documentaires ;
  - une mise a jour eventuelle des documents lies.
- title: 16. Roles et responsabilites
  tables:
  - headers:
    - Acteur
    - Responsabilites
    rows:
    - - Maitre d'Ouvrage (CEVA)
      - Validation des besoins, arbitrages, validation des ponderations, decisions strategiques.
    - - AMO / RHYAD
      - Animation des ateliers, redaction des livrables, coordination documentaire, gestion des interfaces, aide a la decision.
    - - Maitrise d'Oeuvre / Bureaux d'Etudes
      - Conception technique, analyses, justification des solutions, production des etudes.
    - - Entreprises
      - Realisation des travaux, essais, mise en service et DOE.
    title: 16. Roles et responsabilites
  text: Les responsabilites de chaque acteur sont precisees dans les documents contractuels du projet.
- title: 17. Regles d'evolution de la methode
  text: 'La methode RHYAD constitue un referentiel vivant.


    Toute evolution :


    Les evolutions de la methode ont pour objectif :'
  bullets:
  - est enregistree dans le Registre des Decisions ;
  - est versionnee ;
  - est documentee ;
  - est approuvee avant sa diffusion ;
  - ne remet pas en cause les versions utilisees sur les projets deja engages.
  - l'amelioration continue ;
  - la capitalisation du retour d'experience ;
  - l'harmonisation des pratiques ;
  - l'amelioration de la qualite documentaire.
- title: 18. Principes fondamentaux RHYAD
  text: 'La methode RHYAD repose notamment sur les principes suivants :


    Ces principes constituent le socle methodologique commun applicable a l''ensemble des projets realises selon la methode
    RHYAD.'
  bullets:
  - Concevoir pour l'ensemble du cycle de vie de l'installation et non uniquement pour la reception des travaux.
  - Integrer la maintenabilite des les premieres phases de conception.
  - Concevoir des installations evolutives et resilientes.
  - Etudier systematiquement les variantes lorsqu'elles apportent une valeur au projet.
  - Justifier objectivement chaque choix technique.
  - Garantir la coherence documentaire et la tracabilite des decisions.
  - Privilegier des solutions simples, robustes et adaptees au contexte local.
  - Limiter les consommations de ressources sans compromettre les performances pharmaceutiques.
  - Integrer les exigences reglementaires des les premieres phases du projet.
  - Assurer une coordination permanente entre les disciplines.
  - Considerer les impacts documentaires comme une composante de chaque decision technique.
- title: 19. Conclusion
  text: 'La methode RHYAD fournit un cadre documentaire, methodologique et decisionnel destine a conduire des projets industriels
    complexes de maniere coherente, tracable et collaborative.


    Elle garantit :


    La methode RHYAD constitue ainsi un referentiel commun permettant d''ameliorer la qualite des etudes, de securiser les
    decisions et de faciliter le pilotage des projets industriels complexes.


    Fin du document'
  bullets:
  - une gouvernance documentaire unique ;
  - une continuite entre la programmation, la conception et la realisation ;
  - une justification des choix techniques ;
  - une aide a la decision pour le Maitre d'Ouvrage ;
  - une maitrise des interfaces entre disciplines ;
  - une meilleure gestion des risques ;
  - une coherence documentaire sur l'ensemble du cycle de vie du projet ;
  - une capitalisation des connaissances pour les futurs projets.
