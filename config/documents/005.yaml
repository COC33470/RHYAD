reference: CEVA-RHYAD-005-REGISTRE DES DECISIONS
title: Registre des Décisions
revision: Rev1.0
status: Validated
chapters:
- title: 1. Objet
  text: 'Le présent document constitue le registre unique des décisions du projet

    RHYAD.


    Il assure la traçabilité de l''ensemble des décisions prises pendant la

    programmation, la conception, la réalisation et la mise en service du

    projet.


    Chaque décision est identifiée, justifiée, validée, historisée et reliée

    aux documents qu''elle impacte.'
- title: 2. Domaine d'application
  text: 'Le registre couvre notamment :'
  bullets:
  - les décisions de gouvernance ;
  - les décisions fonctionnelles ;
  - les décisions techniques ;
  - les arbitrages du Maître d'Ouvrage ;
  - les validations des Design Drivers ;
  - les validations des pondérations de la matrice multicritère ;
  - les validations des Design Basis ;
  - les décisions documentaires.
- title: 3. Documents de référence
  bullets:
  - CEVA-RHYAD-001-CHARTE --- Charte Projet
  - CEVA-RHYAD-002-PF --- Programme Fonctionnel
  - CEVA-RHYAD-004-REGISTRE DES RISQUES --- Registre des Risques
  - CEVA-RHYAD-006-PDD --- Plan Directeur Documentaire
  - CEVA-RHYAD-000-MTH01 --- Guide Méthodologique RHYAD
  - CEVA-RHYAD-400-Rxx --- Réunions
  - CEVA-RHYAD-500-REG01 --- Registre des Actions
- title: 4. Principes
  text: 'Le registre des décisions constitue la référence unique pour toutes les

    décisions du projet.


    Chaque décision :'
  bullets:
  - possède un identifiant unique ;
  - est enregistrée une seule fois ;
  - est datée ;
  - est validée par l'autorité compétente ;
  - référence les documents concernés ;
  - reste consultable même après son application.
