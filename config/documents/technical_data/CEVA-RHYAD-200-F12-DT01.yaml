- title: Remarques RHYAD
  blocks:
  - type: text
    text: La sûreté devra être conçue selon une approche de défense en profondeur combinant la protection périmétrique, le
      contrôle des accès, la surveillance des bâtiments, la protection des infrastructures critiques, la gestion des visiteurs
      et la préparation aux situations exceptionnelles.
  - type: text
    text: Le document prend en compte les risques liés au contexte géopolitique sans les confondre avec les risques projet.
      Les mesures de protection devront être définies en cohérence avec les standards du Groupe CEVA et les exigences locales.
  - type: text
    text: Les aspects de cybersécurité sont traités dans le document **CEVA-RHYAD-200-F13-DT01**, tout en conservant des interfaces
      fortes avec le présent document.
  text: 'La sûreté devra être conçue selon une approche de défense en profondeur combinant la protection périmétrique, le
    contrôle des accès, la surveillance des bâtiments, la protection des infrastructures critiques, la gestion des visiteurs
    et la préparation aux situations exceptionnelles.


    Le document prend en compte les risques liés au contexte géopolitique sans les confondre avec les risques projet. Les
    mesures de protection devront être définies en cohérence avec les standards du Groupe CEVA et les exigences locales.


    Les aspects de cybersécurité sont traités dans le document **CEVA-RHYAD-200-F13-DT01**, tout en conservant des interfaces
    fortes avec le présent document.'
- title: Fin du document
