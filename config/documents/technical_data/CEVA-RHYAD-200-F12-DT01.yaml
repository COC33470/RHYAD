reference: CEVA-RHYAD-200-F12-DT01
title: Sûreté, Protection des Actifs et Contrôle des Accès — Données Techniques d'Entrée
revision: Rev1.0
status: Draft
chapters:
- title: Objet
  blocks:
  - type: text
    text: Le présent document a pour objet de recenser l'ensemble des données techniques nécessaires à la conception des systèmes
      de sûreté (Security) du Campus CEVA.
  - type: text
    text: Il couvre la protection des personnes, des bâtiments, des équipements, des matières, des produits, des informations
      sensibles et des infrastructures critiques contre les actes de malveillance, d'intrusion, de sabotage, de vol ou de
      dégradation.
  text: 'Le présent document a pour objet de recenser l''ensemble des données techniques nécessaires à la conception des systèmes
    de sûreté (Security) du Campus CEVA.


    Il couvre la protection des personnes, des bâtiments, des équipements, des matières, des produits, des informations sensibles
    et des infrastructures critiques contre les actes de malveillance, d''intrusion, de sabotage, de vol ou de dégradation.'
