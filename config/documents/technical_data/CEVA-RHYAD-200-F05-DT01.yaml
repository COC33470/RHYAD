chapters:
- title: Objet
  blocks:
  - type: text
    text: Le présent document a pour objet de recenser l'ensemble des données techniques nécessaires à la conception de la
      fonction **F05 -- Conditionnement et Expédition des Produits**.
  - type: text
    text: Il constitue le document de référence pour le dimensionnement des zones de conditionnement, des équipements, des
      flux, des utilités et des interfaces logistiques.
  text: 'Le présent document a pour objet de recenser l''ensemble des données techniques nécessaires à la conception de la
    fonction **F05 -- Conditionnement et Expédition des Produits**.


