- title: Remarques RHYAD
  blocks:
  - type: list
    items:
    - Définir les analyses réalisées en routine.
    - Identifier les équipements analytiques nécessaires.
    - Définir les interfaces avec la production.
    - Définir les exigences de gestion des données (LIMS, ALCOA+, archivage).
    - Définir les besoins en utilités des laboratoires.
    - Définir les exigences GMP/BPF applicables.
  - type: text
    text: La question des contrôles qualité réalisés directement par les vétérinaires reste à confirmer avec CEVA.
  - type: text
    text: '**Principe RHYAD :** Une information = une seule source.'
  bullets:
  - Définir les analyses réalisées en routine.
  - Identifier les équipements analytiques nécessaires.
  - Définir les interfaces avec la production.
  - Définir les exigences de gestion des données (LIMS, ALCOA+, archivage).
  - Définir les besoins en utilités des laboratoires.
  - Définir les exigences GMP/BPF applicables.
  text: 'La question des contrôles qualité réalisés directement par les vétérinaires reste à confirmer avec CEVA.


