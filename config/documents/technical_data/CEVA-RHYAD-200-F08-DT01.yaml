reference: CEVA-RHYAD-200-F08-DT01
title: Contrôle Qualité — Données Techniques d'Entrée
revision: Rev1.0
status: Draft
chapters:
- title: Objet
  blocks:
  - type: text
    text: Le présent document a pour objet de recenser l'ensemble des données techniques nécessaires à la conception des laboratoires
      et des activités de Contrôle Qualité (QC) du Campus CEVA.
  - type: text
    text: Il constitue le document de référence pour le dimensionnement des locaux, des équipements analytiques, des utilités,
      des flux et des interfaces avec la production.
  text: 'Le présent document a pour objet de recenser l''ensemble des données techniques nécessaires à la conception des laboratoires
    et des activités de Contrôle Qualité (QC) du Campus CEVA.


    Il constitue le document de référence pour le dimensionnement des locaux, des équipements analytiques, des utilités, des
    flux et des interfaces avec la production.'
