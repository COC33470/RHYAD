- title: Remarques RHYAD
  blocks:
  - type: text
    text: La stratégie de gestion des déchets couvre l'ensemble des activités du Campus.
  - type: text
    text: 'Les études devront définir :'
  - type: list
    items:
    - les circuits de collecte séparés ;
    - les capacités de stockage temporaire ;
    - les besoins en traitement des effluents ;
    - les interfaces avec les prestataires locaux ;
    - les exigences réglementaires applicables en Arabie Saoudite.
  - type: text
    text: La définition détaillée des déchets biologiques sera établie avec CEVA. RHYAD traduit ces besoins en exigences de
      conception.
  text: 'La stratégie de gestion des déchets couvre l''ensemble des activités du Campus.


    Les études devront définir :


    La définition détaillée des déchets biologiques sera établie avec CEVA. RHYAD traduit ces besoins en exigences de conception.'
  bullets:
  - les circuits de collecte séparés ;
  - les capacités de stockage temporaire ;
  - les besoins en traitement des effluents ;
  - les interfaces avec les prestataires locaux ;
  - les exigences réglementaires applicables en Arabie Saoudite.
- title: Recommandation RHYAD
  blocks:
  - type: text
    text: 'Ajouter en phase APS une matrice de gestion des déchets croisant :'
  - type: list
    items:
    - type de déchet ;
    - origine ;
    - niveau de risque ;
    - mode de collecte ;
    - stockage ;
    - traitement ;
    - filière d'élimination.
  - type: text
    text: Cette matrice servira de support de validation avec CEVA et aux études Process, Architecture et Logistique.
  text: 'Ajouter en phase APS une matrice de gestion des déchets croisant :


    Cette matrice servira de support de validation avec CEVA et aux études Process, Architecture et Logistique.'
  bullets:
  - type de déchet ;
  - origine ;
  - niveau de risque ;
  - mode de collecte ;
  - stockage ;
  - traitement ;
  - filière d'élimination.
- title: Fin du document
