reference: CEVA-RHYAD-200-F11-DT01
title: Gestion des Déchets et Effluents — Données Techniques d'Entrée
revision: Rev1.0
status: Draft
chapters:
- title: Objet
  blocks:
  - type: text
    text: Le présent document a pour objet de recenser l'ensemble des données techniques nécessaires à la conception des systèmes
      de gestion des déchets et des effluents produits par le Campus CEVA.
  - type: text
    text: Il couvre les déchets issus des activités de production, des laboratoires, des utilités, de la maintenance, des
      bureaux et des espaces communs.
  text: 'Le présent document a pour objet de recenser l''ensemble des données techniques nécessaires à la conception des systèmes
    de gestion des déchets et des effluents produits par le Campus CEVA.


    Il couvre les déchets issus des activités de production, des laboratoires, des utilités, de la maintenance, des bureaux
    et des espaces communs.'
