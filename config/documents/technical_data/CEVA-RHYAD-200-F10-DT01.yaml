reference: CEVA-RHYAD-200-F10-DT01
title: Maintenance et Exploitation Technique — Données Techniques d'Entrée
revision: Rev1.0
status: Draft
chapters:
- title: Objet
  blocks:
  - type: text
    text: Le présent document a pour objet de recenser l'ensemble des données techniques nécessaires à la conception des installations
      de maintenance et des moyens d'exploitation du Campus CEVA.
  - type: text
    text: Il définit les exigences permettant d'assurer une maintenance sûre, efficace et compatible avec la continuité de
      la production.
  text: 'Le présent document a pour objet de recenser l''ensemble des données techniques nécessaires à la conception des installations
    de maintenance et des moyens d''exploitation du Campus CEVA.


    Il définit les exigences permettant d''assurer une maintenance sûre, efficace et compatible avec la continuité de la production.'
