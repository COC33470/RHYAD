- title: Remarques RHYAD
  blocks:
  - type: text
    text: 'Les études devront notamment vérifier :'
  - type: list
    items:
    - l'accessibilité de tous les équipements sans démontage majeur ;
    - la possibilité d'intervenir sur les équipements critiques avec un impact minimal sur la production ;
    - les réserves d'espace nécessaires au remplacement futur des équipements ;
    - la disponibilité locale des pièces de rechange et des compétences techniques, conformément à l'ACAP ;
    - les interfaces entre la GMAO, les automatismes et les équipements critiques.
  - type: text
    text: Les données collectées alimenteront directement les DB Maintenance, Architecture, Utilités, Électricité, Instrumentation
      et Process.
  text: 'Les études devront notamment vérifier :


    Les données collectées alimenteront directement les DB Maintenance, Architecture, Utilités, Électricité, Instrumentation
    et Process.'
  bullets:
  - l'accessibilité de tous les équipements sans démontage majeur ;
  - la possibilité d'intervenir sur les équipements critiques avec un impact minimal sur la production ;
  - les réserves d'espace nécessaires au remplacement futur des équipements ;
  - la disponibilité locale des pièces de rechange et des compétences techniques, conformément à l'ACAP ;
  - les interfaces entre la GMAO, les automatismes et les équipements critiques.
- title: Recommandation RHYAD
  blocks:
  - type: text
    text: 'En phase APS, réaliser une revue de maintenabilité pour chaque équipement critique afin de vérifier :'
  - type: list
    items:
    - les dégagements de maintenance ;
    - les moyens de levage nécessaires ;
    - les cheminements d'extraction ;
    - les possibilités de maintenance sans arrêt de production ;
    - les réserves pour les extensions futures.
  text: 'En phase APS, réaliser une revue de maintenabilité pour chaque équipement critique afin de vérifier :'
  bullets:
