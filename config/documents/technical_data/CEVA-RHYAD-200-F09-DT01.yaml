- title: Remarques RHYAD
  blocks:
  - type: text
    text: 'Ce DT est le document de référence des utilités. Il devra permettre de dimensionner l''ensemble des réseaux et
      installations en cohérence avec :'
  - type: list
    items:
    - les besoins du procédé ;
    - les exigences GMP/BPF ;
    - les contraintes du site ;
    - les scénarios d'évolution du Campus.
  - type: text
    text: Les variantes énergétiques (photovoltaïque, BESS, groupes électrogènes, géothermie, refroidissement passif par bassin
      d'eau) sont intégrées comme variantes à étudier, sans préjuger du choix final.
  - type: text
    text: La criticité des utilités sera déterminée au cours des études selon les équipements retenus, les exigences du procédé
      et les analyses de risques.
  - type: text
    text: '**Principe RHYAD : Une information = une seule source.**'
  text: 'Ce DT est le document de référence des utilités. Il devra permettre de dimensionner l''ensemble des réseaux et installations
    en cohérence avec :


    Les variantes énergétiques (photovoltaïque, BESS, groupes électrogènes, géothermie, refroidissement passif par bassin
    d''eau) sont intégrées comme variantes à étudier, sans préjuger du choix final.


    La criticité des utilités sera déterminée au cours des études selon les équipements retenus, les exigences du procédé
    et les analyses de risques.


    **Principe RHYAD : Une information = une seule source.**'
  bullets:
  - les besoins du procédé ;
  - les exigences GMP/BPF ;
  - les contraintes du site ;
  - les scénarios d'évolution du Campus.
- title: Fin du document
