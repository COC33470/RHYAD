title: Utilités Industrielles — Données Techniques d'Entrée
revision: Rev1.0
status: Draft
chapters:
- title: Objet
  blocks:
  - type: text
    text: Le présent document a pour objet de recenser l'ensemble des données techniques nécessaires à la conception, au dimensionnement
      et à l'exploitation des utilités industrielles du Campus CEVA.
  - type: text
    text: Il constitue le document de référence pour l'ensemble des études Process, CVC, Électricité, Architecture, Maintenance
      et Exploitation.
  text: 'Le présent document a pour objet de recenser l''ensemble des données techniques nécessaires à la conception, au dimensionnement
    et à l''exploitation des utilités industrielles du Campus CEVA.


    Il constitue le document de référence pour l''ensemble des études Process, CVC, Électricité, Architecture, Maintenance
    et Exploitation.'
