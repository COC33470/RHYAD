revision: Rev1.0
status: Draft
chapters:
- title: Objet
  blocks:
  - type: text
    text: Le présent document a pour objet de recenser l'ensemble des données techniques nécessaires à la conception de la
      fonction **F04 -- Production des Autovaccins**.
  - type: text
    text: Il constitue le document de référence pour le dimensionnement des zones de production, des équipements de procédé,
      des utilités, des interfaces GMP/BPF et des contraintes d'exploitation.
  text: 'Le présent document a pour objet de recenser l''ensemble des données techniques nécessaires à la conception de la
    fonction **F04 -- Production des Autovaccins**.


    Il constitue le document de référence pour le dimensionnement des zones de production, des équipements de procédé, des
    utilités, des interfaces GMP/BPF et des contraintes d''exploitation.'
