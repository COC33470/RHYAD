- title: Remarques RHYAD
  blocks:
  - type: list
    items:
    - Évolution du site de **100--300 L** vers **1000 L**.
    - Modularité des installations.
    - Compatibilité avec une architecture évolutive.
    - Alimentation des Design Basis Process, Architecture, CVC, Utilités, Électricité, Instrumentation et Maintenance.
    - Les paramètres critiques du procédé seront renseignés avec CEVA lors des ateliers techniques.
    - Un tableau des **Critical Process Parameters (CPP)** et des **Critical Quality Attributes (CQA)** pourra être ajouté
      lorsqu'ils seront disponibles, conformément au principe « une information = une seule source ».
  bullets:
  - Évolution du site de **100--300 L** vers **1000 L**.
  - Modularité des installations.
  - Compatibilité avec une architecture évolutive.
  - Alimentation des Design Basis Process, Architecture, CVC, Utilités, Électricité, Instrumentation et Maintenance.
  - Les paramètres critiques du procédé seront renseignés avec CEVA lors des ateliers techniques.
  - Un tableau des **Critical Process Parameters (CPP)** et des **Critical Quality Attributes (CQA)** pourra être ajouté lorsqu'ils
    seront disponibles, conformément au principe « une information = une seule source ».
