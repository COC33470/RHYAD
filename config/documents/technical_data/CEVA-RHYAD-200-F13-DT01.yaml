- title: Remarques RHYAD
  blocks:
  - type: text
    text: Le projet RHYAD s'appuiera sur les standards IT/OT du Groupe CEVA, qui constitueront la base de conception des systèmes
      numériques.
  - type: text
    text: 'Ce projet étant le premier site CEVA en Arabie Saoudite, les solutions retenues devront être examinées de manière
      critique afin de vérifier leur adéquation avec :'
  - type: list
    items:
    - les infrastructures télécom locales ;
    - les contraintes réglementaires saoudiennes ;
    - les délais d'approvisionnement ;
    - la disponibilité des compétences locales ;
    - les risques géopolitiques et logistiques identifiés dans l'ACAP.
  - type: text
    text: Une réunion spécifique IT/OT sera organisée avec la Direction IT de CEVA après la première réunion de programmation.
      Elle permettra de recueillir les standards Groupe, d'identifier les adaptations nécessaires et d'enregistrer les actions
      dans le registre projet.
  text: 'Le projet RHYAD s''appuiera sur les standards IT/OT du Groupe CEVA, qui constitueront la base de conception des systèmes
    numériques.


    Ce projet étant le premier site CEVA en Arabie Saoudite, les solutions retenues devront être examinées de manière critique
    afin de vérifier leur adéquation avec :


    Une réunion spécifique IT/OT sera organisée avec la Direction IT de CEVA après la première réunion de programmation. Elle
    permettra de recueillir les standards Groupe, d''identifier les adaptations nécessaires et d''enregistrer les actions
    dans le registre projet.'
  bullets:
  - les infrastructures télécom locales ;
  - les contraintes réglementaires saoudiennes ;
  - les délais d'approvisionnement ;
  - la disponibilité des compétences locales ;
  - les risques géopolitiques et logistiques identifiés dans l'ACAP.
- title: Recommandation RHYAD
  blocks:
  - type: text
    text: 'Le DB-006 --- IT / OT devra comporter une architecture de référence distinguant clairement :'
  - type: list
    items:
    - le réseau IT d'entreprise ;
    - le réseau OT industriel ;
    - les zones démilitarisées (DMZ) ;
    - les systèmes critiques ;
    - les accès distants ;
    - les interfaces avec les équipements de production.
  - type: text
    text: Cette architecture devra respecter les principes de segmentation et de défense en profondeur, tout en restant compatible
      avec les standards CEVA et les exigences de cybersécurité industrielle, notamment IEC 62443.
  text: 'Le DB-006 --- IT / OT devra comporter une architecture de référence distinguant clairement :


    Cette architecture devra respecter les principes de segmentation et de défense en profondeur, tout en restant compatible
    avec les standards CEVA et les exigences de cybersécurité industrielle, notamment IEC 62443.'
  bullets:
  - le réseau IT d'entreprise ;
  - le réseau OT industriel ;
  - les zones démilitarisées (DMZ) ;
  - les systèmes critiques ;
  - les accès distants ;
  - les interfaces avec les équipements de production.
- title: Fin du document
