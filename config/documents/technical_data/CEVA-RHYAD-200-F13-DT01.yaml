reference: CEVA-RHYAD-200-F13-DT01
title: Systèmes d’Information, Automatismes et Cybersécurité — Données Techniques d'Entrée
revision: Rev1.0
status: Draft
chapters:
- title: Objet
  blocks:
  - type: text
    text: Le présent document a pour objet de recenser l'ensemble des données techniques nécessaires à la conception des systèmes
      d'information (IT), des systèmes industriels (OT), des automatismes et des dispositifs de cybersécurité du Campus CEVA.
  - type: text
    text: Il couvre les infrastructures numériques, les systèmes de supervision, les réseaux, les automatismes industriels
      et les mesures de protection des données et des installations critiques.
  text: 'Le présent document a pour objet de recenser l''ensemble des données techniques nécessaires à la conception des systèmes
    d''information (IT), des systèmes industriels (OT), des automatismes et des dispositifs de cybersécurité du Campus CEVA.


    Il couvre les infrastructures numériques, les systèmes de supervision, les réseaux, les automatismes industriels et les
    mesures de protection des données et des installations critiques.'
