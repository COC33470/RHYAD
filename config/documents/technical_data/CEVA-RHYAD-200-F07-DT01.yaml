reference: CEVA-RHYAD-200-F07-DT01
title: Lavage, Stérilisation et Préparation des Équipements — Données Techniques d'Entrée
revision: Rev1.0
status: Draft
chapters:
- title: Objet
  blocks:
  - type: text
    text: Le présent document a pour objet de recenser l'ensemble des données techniques nécessaires à la conception des installations
      de lavage, de stérilisation, de préparation et de stockage des équipements réutilisables intervenant dans la production
      des autovaccins.
  - type: text
    text: Il constitue le document de référence pour le dimensionnement des équipements, des locaux, des utilités et des flux
      associés.
  text: 'Le présent document a pour objet de recenser l''ensemble des données techniques nécessaires à la conception des installations
    de lavage, de stérilisation, de préparation et de stockage des équipements réutilisables intervenant dans la production
    des autovaccins.


    Il constitue le document de référence pour le dimensionnement des équipements, des locaux, des utilités et des flux associés.'
