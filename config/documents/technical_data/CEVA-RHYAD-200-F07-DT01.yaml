- title: Remarques RHYAD
  blocks:
  - type: list
    items:
    - Identifier les équipements réutilisables et ceux à usage unique.
    - Définir la stratégie de lavage (manuel, COP, CIP, laveur GMP, etc.).
    - Définir les besoins de stérilisation (autoclaves, vapeur propre, autres procédés).
    - Définir les exigences de validation des cycles.
    - Définir les interfaces avec les utilités critiques.
    - Prendre en compte les deux phases du projet (100--300 L puis 1000 L).
  bullets:
  - Identifier les équipements réutilisables et ceux à usage unique.
  - Définir la stratégie de lavage (manuel, COP, CIP, laveur GMP, etc.).
  - Définir les besoins de stérilisation (autoclaves, vapeur propre, autres procédés).
  - Définir les exigences de validation des cycles.
  - Définir les interfaces avec les utilités critiques.
  - Prendre en compte les deux phases du projet (100--300 L puis 1000 L).
- title: Recommandation RHYAD
  blocks:
  - type: text
    text: Ajouter en phase APS un synoptique des flux **sale → propre → stérile** afin de valider les flux GMP et l'implantation
      des locaux.
  text: Ajouter en phase APS un synoptique des flux **sale → propre → stérile** afin de valider les flux GMP et l'implantation
    des locaux.
