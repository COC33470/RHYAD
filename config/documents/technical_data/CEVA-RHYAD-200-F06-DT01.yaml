reference: CEVA-RHYAD-200-F06-DT01
title: Gestion des Flux — Données Techniques d'Entrée
revision: Rev1.0
status: Draft
chapters:
- title: Objet
  blocks:
  - type: text
    text: Le présent document a pour objet de définir l'ensemble des données techniques nécessaires à la conception des flux
      internes du Campus CEVA.
  - type: text
    text: Il couvre les flux de personnel, de matières, de produits, de déchets, d'équipements et de maintenance afin de garantir
      la sécurité biologique, la conformité GMP/BPF et l'efficacité opérationnelle.
  text: 'Le présent document a pour objet de définir l''ensemble des données techniques nécessaires à la conception des flux
    internes du Campus CEVA.


    Il couvre les flux de personnel, de matières, de produits, de déchets, d''équipements et de maintenance afin de garantir
    la sécurité biologique, la conformité GMP/BPF et l''efficacité opérationnelle.'
