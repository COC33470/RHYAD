- title: Remarques RHYAD
  blocks:
  - type: list
    items:
    - Séparation stricte des flux propres, sales et biologiques.
    - Absence de croisements entre les flux de personnel, de matières, de produits et de déchets.
    - Interfaces avec les zones classées GMP.
    - Prise en compte de l'évolution de capacité de 100--300 L vers 1000 L.
    - Intégration des contraintes logistiques propres au Royaume d'Arabie Saoudite.
    - Les schémas de circulation alimenteront les DB Process, Architecture, CVC/HVAC et Logistique ainsi que les études APS/APD.
  bullets:
  - Séparation stricte des flux propres, sales et biologiques.
  - Absence de croisements entre les flux de personnel, de matières, de produits et de déchets.
  - Interfaces avec les zones classées GMP.
  - Prise en compte de l'évolution de capacité de 100--300 L vers 1000 L.
  - Intégration des contraintes logistiques propres au Royaume d'Arabie Saoudite.
  - Les schémas de circulation alimenteront les DB Process, Architecture, CVC/HVAC et Logistique ainsi que les études APS/APD.
- title: Fin du document
