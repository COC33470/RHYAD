revision: Rev1.0
status: Draft
chapters:
- title: Objet
  blocks:
  - type: text
    text: Le présent document a pour objet de définir les données techniques nécessaires à la conception des espaces administratifs,
      de formation, des services généraux et des espaces de vie du Campus CEVA.
  - type: text
    text: Il couvre l'ensemble des fonctions tertiaires nécessaires au bon fonctionnement du site.
  text: 'Le présent document a pour objet de définir les données techniques nécessaires à la conception des espaces administratifs,
    de formation, des services généraux et des espaces de vie du Campus CEVA.


    Il couvre l''ensemble des fonctions tertiaires nécessaires au bon fonctionnement du site.'
