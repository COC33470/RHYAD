- title: Remarques RHYAD
  blocks:
  - type: text
    text: Les espaces tertiaires devront être conçus selon les mêmes principes de qualité que les installations industrielles,
      tout en répondant aux exigences de confort, de flexibilité et de collaboration.
  - type: text
    text: 'Une attention particulière sera portée à :'
  - type: list
    items:
    - l'évolutivité des espaces administratifs ;
    - l'intégration des outils collaboratifs et de visioconférence ;
    - la qualité des espaces de formation, essentiels pour les activités GMP et HSE ;
    - la séparation des flux visiteurs, collaborateurs et zones de production ;
    - l'intégration des exigences de sûreté et de cybersécurité dans les espaces tertiaires.
  text: 'Les espaces tertiaires devront être conçus selon les mêmes principes de qualité que les installations industrielles,
    tout en répondant aux exigences de confort, de flexibilité et de collaboration.


    Une attention particulière sera portée à :'
  bullets:
  - l'évolutivité des espaces administratifs ;
  - l'intégration des outils collaboratifs et de visioconférence ;
  - la qualité des espaces de formation, essentiels pour les activités GMP et HSE ;
  - la séparation des flux visiteurs, collaborateurs et zones de production ;
  - l'intégration des exigences de sûreté et de cybersécurité dans les espaces tertiaires.
- title: Recommandation RHYAD
  blocks:
  - type: text
    text: Ajouter une étude d'occupation des espaces tertiaires (Workplace Strategy) en phases APS/APD afin d'ajuster les
      surfaces administratives, les salles de réunion et les espaces collaboratifs aux besoins réels de CEVA, tout en limitant
      les surcoûts de construction et d'exploitation.
  text: Ajouter une étude d'occupation des espaces tertiaires (Workplace Strategy) en phases APS/APD afin d'ajuster les surfaces
    administratives, les salles de réunion et les espaces collaboratifs aux besoins réels de CEVA, tout en limitant les surcoûts
    de construction et d'exploitation.
- title: Fin du document
