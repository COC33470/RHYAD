reference: CEVA-RHYAD-200-F15-DT01
title: Développement Futur et Réserves Foncières — Données Techniques d'Entrée
revision: Rev1.0
status: Draft
chapters:
- title: Objet
  blocks:
  - type: text
    text: Définir l'ensemble des données nécessaires à la coordination des études et à la maîtrise des interfaces entre les
      disciplines afin de garantir une conception cohérente du projet.
  - type: text
    text: '> **Principe méthodologique RHYAD**\ > Les documents RHYAD définissent les exigences de conception permettant >
      la future exploitation du Campus. Ils ne décrivent jamais les > procédures d''exploitation, les modes opératoires, les
      SOP, la GMAO ou > l''organisation future de CEVA.'
  text: 'Définir l''ensemble des données nécessaires à la coordination des études et à la maîtrise des interfaces entre les
    disciplines afin de garantir une conception cohérente du projet.


    > **Principe méthodologique RHYAD**\ > Les documents RHYAD définissent les exigences de conception permettant > la future
    exploitation du Campus. Ils ne décrivent jamais les > procédures d''exploitation, les modes opératoires, les SOP, la GMAO
    ou > l''organisation future de CEVA.'
