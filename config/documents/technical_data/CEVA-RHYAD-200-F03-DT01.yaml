- title: Objet
  blocks:
  - type: text
    text: Le présent document a pour objet de recenser l'ensemble des données techniques nécessaires à la conception de la
      fonction **F03 -- Préparation des Matières Premières et Solutions**.
  - type: text
    text: Il constitue le document de référence pour le dimensionnement des locaux, des équipements, des utilités et des flux
      associés aux opérations de préparation.
  text: 'Le présent document a pour objet de recenser l''ensemble des données techniques nécessaires à la conception de la
