  - id: "G-DEF-001"
    category: "technical_definition"
    term: "Campus"
    acronym: ""
    definition: "Ensemble des bâtiments, infrastructures, réseaux et espaces extérieurs constituant le projet RHYAD."
    source: "RHYAD"
    status: "Validated"
  - id: "G-DEF-002"
    category: "technical_definition"
    term: "Coque climatique"
    acronym: ""
    definition: "Volume bâti maintenu à des conditions climatiques maîtrisées servant d’enveloppe aux modules GMP."
    source: "RHYAD"
    status: "Validated"
  - id: "G-DEF-003"
    category: "technical_definition"
    term: "Module GMP"
    acronym: ""
    definition: "Ensemble fonctionnel de production répondant aux exigences GMP/BPF et disposant de ses propres équipements techniques (CTA, utilités, etc.)."
    source: "RHYAD"
    status: "Validated"
  - id: "G-DEF-004"
    category: "technical_definition"
    term: "Salle blanche"
    acronym: ""
    definition: "Local dont la contamination particulaire et microbiologique est maîtrisée conformément aux exigences GMP/BPF."
    source: "GMP"
    status: "Validated"
  - id: "G-DEF-005"
    category: "technical_definition"
    term: "Infrastructure critique"
    acronym: ""
    definition: "Installation, équipement ou système dont la défaillance peut entraîner un arrêt de production, une perte de conformité GMP, une atteinte à la sécurité, à la sûreté ou une interruption significative de l’exploitation."
    source: "RHYAD"
    status: "Validated"
  - id: "G-DEF-006"
    category: "technical_definition"
    term: "Continuité d’activité"
    acronym: ""
    definition: "Capacité à maintenir les fonctions essentielles malgré une défaillance ou un événement perturbateur."
    source: "RHYAD"
    status: "Validated"
  - id: "G-DEF-007"
    category: "technical_definition"
    term: "Résilience"
    acronym: ""
    definition: "Capacité d’un système à maintenir ou retrouver un fonctionnement acceptable après une perturbation."
    source: "RHYAD"
    status: "Validated"
  - id: "G-DEF-008"
    category: "technical_definition"
    term: "Défense en profondeur"
    acronym: ""
    definition: "Mise en œuvre de plusieurs niveaux de protection indépendants afin de réduire les risques."
    source: "RHYAD"
    status: "Validated"
  - id: "G-DEF-009"
    category: "technical_definition"
    term: "Redondance"
    acronym: ""
    definition: "Duplication partielle ou totale d’un équipement ou d’un système afin d’assurer la continuité de service."
    source: "RHYAD"
    status: "Validated"
  - id: "G-DEF-010"
    category: "technical_definition"
    term: "Disponibilité"
    acronym: ""
    definition: "Aptitude d’un système à être opérationnel lorsqu’il est sollicité."
    source: "RHYAD"
    status: "Validated"
  - id: "G-DEF-011"
    category: "technical_definition"
    term: "Mode dégradé"
    acronym: ""
    definition: "Fonctionnement temporaire avec des performances réduites tout en maintenant les fonctions essentielles."
    source: "RHYAD"
    status: "Validated"
  - id: "G-DEF-012"
    category: "technical_definition"
    term: "Design Driver"
    acronym: ""
    definition: "Facteur de conception orientant les choix techniques et servant de critère d’évaluation des variantes."
    source: "RHYAD"
    status: "Validated"

  - id: "G-MTH-001"
    category: "methodology_principle"
    acronym: "P-001"
    definition: "Une information = une seule source"
    source: "CEVA-RHYAD-000-MTH01"
    status: "Validated"
  - id: "G-MTH-002"
    category: "methodology_principle"
    acronym: "P-002"
    definition: "Les documents RHYAD définissent les exigences de conception et non les procédures d’exploitation"
    source: "CEVA-RHYAD-000-MTH01"
    status: "Validated"
  - id: "G-MTH-003"
    category: "methodology_principle"
    acronym: "P-003"
    definition: "Toute solution technique doit être justifiée par une analyse de variantes"
    source: "CEVA-RHYAD-000-MTH01"
    status: "Validated"
  - id: "G-MTH-004"
    category: "methodology_principle"
    acronym: "P-004"
    definition: "Toute décision identifie les impacts documentaires associés"
    source: "CEVA-RHYAD-000-MTH01"
    status: "Validated"
  - id: "G-MTH-005"
    category: "methodology_principle"
    acronym: "P-005"
    definition: "Les infrastructures critiques sont identifiées par une analyse de risques"
    source: "CEVA-RHYAD-000-MTH01"
    status: "Validated"

